<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Syzygy">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Syzygy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
<style>
/* Layout: one full-screen canvas is the solar system seen from above. Over it float the date (top left),
   the alignment readout and the time bar (bottom, always in reach), a pill dock and one settings sheet.
   Single dark theme: the planets glow, the sky stays dark. */
:root{
  color-scheme: dark;
  --void:#06060f;
  --glass:rgba(15,14,30,.74);
  --line:rgba(210,200,255,.12);
  --text:#efedf8;
  --muted:#9893b0;
  --accent:#c6b4ff;
  --accent-ink:#17112e;
  --gold:#ffd98a;
  --font-display:'Cinzel','Trajan Pro',Georgia,serif;
  --font-mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-body:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
}
html{box-sizing:border-box;height:100%;overflow:hidden;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;overflow:hidden;margin:0;
  background:var(--void);color:var(--text);
  font-family:var(--font-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.brand{
  position:fixed;z-index:5;pointer-events:none;
  top:calc(12px + env(safe-area-inset-top, 0px));
  left:calc(16px + env(safe-area-inset-left, 0px));
  right:calc(70px + env(safe-area-inset-right, 0px));
}
.brand h1{margin:0;font:700 1.05rem/1 var(--font-display);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 14px rgba(198,180,255,.45)}
.brand .date{margin:6px 0 0;font:500 1.55rem/1.05 var(--font-display);letter-spacing:.04em;color:#f6f2ff}
.brand .sub{margin:4px 0 0;font:400 .72rem/1.3 var(--font-mono);letter-spacing:.06em;color:var(--muted)}
.brand .sub b{color:var(--gold);font-weight:700}

.hint{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  top:calc(96px + env(safe-area-inset-top, 0px));
  width:max-content;max-width:calc(100vw - 32px);
  padding:8px 14px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:.84rem;font-weight:600;text-align:center;pointer-events:none;
  transition:opacity .6s;
}
.hint.gone{opacity:0}

/* bottom stack: readout, time bar, dock */
.stack{
  position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(70px + env(safe-area-inset-bottom, 0px));
  width:min(560px,calc(100vw - 16px));
  display:flex;flex-direction:column;gap:6px;
}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
}
.readout{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px;transition:border-color .4s,box-shadow .4s}
.readout.aligned{border-color:rgba(255,217,138,.6);box-shadow:0 0 24px rgba(255,217,138,.18)}
.readout .mid{min-width:0;padding:4px 2px;text-align:center;cursor:pointer;border:0;background:transparent;border-radius:12px}
.readout .who{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;font-weight:600;color:var(--muted)}
.readout .who i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.readout .big{font:700 1.15rem/1.25 var(--font-mono);color:var(--text)}
.readout.aligned .big{color:var(--gold)}
.readout .next{font:400 .74rem/1.3 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .next b{color:var(--text);font-weight:700}
.iconbtn{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn:hover{background:rgba(255,255,255,.07)}
.iconbtn:disabled{opacity:.3;cursor:default}

.timebar{display:flex;align-items:center;gap:2px;padding:4px}
.timebar .speed{flex:1;min-width:0;height:40px;border:0;border-radius:999px;background:rgba(255,255,255,.05);cursor:pointer;
  font:700 .8rem/1 var(--font-mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.timebar .now{height:40px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;padding:0 12px;font-weight:700;font-size:.8rem}
.timebar .now.away{border-color:var(--accent);color:var(--accent)}
.timebar button[aria-pressed="true"]{color:var(--accent)}
.datepick{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:999px}
.datepick:hover{background:rgba(255,255,255,.07)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px}
.datepick input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}

.dock{
  position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:2px;padding:4px;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
}
.dock button,.dock .home,.ghost{
  width:44px;height:44px;border:0;border-radius:999px;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--text);
}
.dock button:hover,.dock .home:hover{background:rgba(255,255,255,.07)}
/* back to the Stim Lab homepage (a home-screen web app has no back button) */
.dock .home{text-decoration:none}
.dock .sep{width:1px;margin:10px 3px;background:var(--line)}
@media (max-width:400px){ .dock button,.dock .home{width:40px} .dock .sep{margin:10px 1px} }
.dock button[aria-pressed="true"],.dock button[aria-expanded="true"]{color:var(--accent)}
.dock [hidden]{display:none}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ghost{
  position:fixed;z-index:6;
  right:calc(14px + env(safe-area-inset-right, 0px));
  top:calc(14px + env(safe-area-inset-top, 0px));
  background:var(--glass);border:1px solid var(--line);opacity:.4;
}
.ghost:hover{opacity:1}
.ghost[hidden]{display:none}
.ui-hidden .brand,.ui-hidden .dock,.ui-hidden .hint,.ui-hidden .sheet,.ui-hidden .stack{opacity:0;pointer-events:none}

/* The sheet: bottom sheet on phones, a floating side panel on wider screens */
.sheet{
  position:fixed;z-index:7;
  left:calc(8px + env(safe-area-inset-left, 0px));right:calc(8px + env(safe-area-inset-right, 0px));
  bottom:calc(70px + env(safe-area-inset-bottom, 0px));
  max-height:min(64vh, 600px);display:flex;flex-direction:column;
  background:rgba(15,14,30,.92);border:1px solid var(--line);border-radius:22px;
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .2s ease-out,opacity .2s;
}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
@media (min-width:760px){
  .sheet{left:auto;right:calc(16px + env(safe-area-inset-right, 0px));top:calc(16px + env(safe-area-inset-top, 0px));bottom:calc(80px + env(safe-area-inset-bottom, 0px));width:370px;max-height:none}
  /* keep the readout and time bar clear of the side panel */
  .sheet-open .stack{left:calc((100vw - 390px) / 2);width:min(560px,calc(100vw - 406px))}
  .sheet-open .hint{left:calc((100vw - 390px) / 2)}
}
.sheet-head{display:flex;align-items:center;gap:4px;padding:8px 8px 4px 10px}
.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:999px;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.1);color:var(--text)}
.sheet-head .x{width:38px;height:38px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;cursor:pointer}
.sheet-body{overflow:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body section[hidden]{display:none}
.sheet h3{margin:14px 0 6px;font:700 .7rem/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet h3:first-child{margin-top:6px}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.preset{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:9px 12px;text-align:left;cursor:pointer}
.preset b{display:block;font:700 .92rem/1.15 var(--font-display);letter-spacing:.04em}
.preset span{display:block;margin-top:3px;font-size:.74rem;color:var(--muted);line-height:1.3}
.preset[aria-pressed="true"]{border-color:var(--accent);background:rgba(198,180,255,.1)}

.row{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:8px;min-height:36px}
.row label{font-weight:600;font-size:.84rem}
.row output{font:400 .76rem/1 var(--font-mono);color:var(--muted);text-align:right;white-space:nowrap}
.row.off{opacity:.4}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-9px;box-shadow:0 0 0 4px rgba(198,180,255,.15),0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:7px 11px;border-radius:999px;font-weight:600;font-size:.8rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.planets button i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chips.planets button[aria-pressed="true"]{background:rgba(198,180,255,.18);color:var(--text)}
.chips button:disabled{opacity:.35;cursor:default}
.small{color:var(--muted);font-size:.78rem;line-height:1.45;margin:8px 0 0}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:9px 14px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer}

.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.events li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:12px;padding:8px 11px;cursor:pointer}
.events li button:hover{border-color:var(--line)}
.events li.past button{opacity:.6}
.events b{font:700 .86rem/1.2 var(--font-mono)}
.events .ago{font:400 .74rem/1.2 var(--font-mono);color:var(--muted);text-align:right}
.events .what{grid-column:1/-1;font-size:.76rem;color:var(--muted)}
.events .span{color:var(--gold)}
.events .here{font:700 .66rem/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:8px 2px 4px}
.status{font:400 .76rem/1.4 var(--font-mono);color:var(--muted);padding:6px 2px}

@media (prefers-reduced-motion:reduce){ .hint,.sheet{transition:none} }
</style>
</head>
<body>
<canvas id="stage" aria-label="The planets seen from above, circling the Sun on their real timing. Tap a planet to track it, drag one around its orbit to wind time." role="img"></canvas>

<div class="brand">
  <h1>SYZYGY</h1>
  <p class="date" id="dateText">&nbsp;</p>
  <p class="sub" id="subText">&nbsp;</p>
</div>

<div class="hint" id="hint">Tap a planet to track it, drag one to wind time</div>

<button class="ghost" id="btnShow" aria-label="Show controls" title="Show controls (H)" hidden>
  <svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<div class="stack" id="stack">
  <div class="panel readout" id="readout">
    <button class="iconbtn" id="btnPrev" aria-label="Previous alignment" title="Previous alignment (,)">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="mid" id="btnReadout" aria-label="Show upcoming alignments">
      <div class="who" id="who"></div>
      <div class="big" id="spanText">&nbsp;</div>
      <div class="next" id="nextText">&nbsp;</div>
    </button>
    <button class="iconbtn" id="btnNext" aria-label="Next alignment" title="Next alignment (.)">
      <svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="panel timebar">
    <button class="iconbtn" id="btnRev" aria-pressed="false" aria-label="Run time backwards" title="Backwards (B)">
      <svg class="i" viewBox="0 0 24 24"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></svg>
    </button>
    <button class="iconbtn" id="btnPlay" aria-label="Pause" title="Play or pause (Space)">
      <svg class="i" viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button class="speed" id="btnSpeed" title="Speed ([ and ])">1 month / s</button>
    <button class="now" id="btnNow" title="Back to today (N)">Now</button>
    <label class="datepick" title="Jump to a date" aria-label="Jump to a date">
      <svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <input type="date" id="dateIn" min="1000-01-01" max="2999-12-31">
    </label>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Syzygy settings">
  <div class="sheet-head">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-track" aria-selected="true">Track</button>
      <button role="tab" id="tab-list" aria-selected="false">Upcoming</button>
      <button role="tab" id="tab-look" aria-selected="false">Look</button>
      <button role="tab" id="tab-sound" aria-selected="false">Sound</button>
    </div>
    <button class="x" id="btnClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <section id="pane-track">
      <h3>Alignments to watch</h3><div class="presets" id="presetList"></div>
      <h3>Planets in the line-up</h3><div class="chips planets" id="planetChips"></div>
      <h3>Seen from</h3><div class="chips" id="viewChips"></div>
      <h3>Counts as lined up</h3><div class="chips" id="lineChips"></div>
      <div class="row"><label for="p-within">Within</label><input type="range" id="p-within" min="0" max="1000" step="1"><output id="o-within"></output></div>
      <p class="small" id="trackNote"></p>
    </section>
    <section id="pane-list" hidden>
      <div class="status" id="listStatus"></div>
      <ul class="events" id="eventList"></ul>
      <div class="actions"><button id="btnMore">Look further ahead</button></div>
    </section>
    <section id="pane-look" hidden></section>
    <section id="pane-sound" hidden></section>
  </div>
</div>

<nav class="dock" aria-label="Syzygy">
  <a class="home" href="./" aria-label="Back to Stim Lab" title="Stim Lab">
    <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
  </a>
  <span class="sep" aria-hidden="true"></span>
  <button id="btnSheet" aria-expanded="false" aria-label="Planets and alignments" title="Planets and alignments">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="6.5" opacity=".5"/><circle cx="12" cy="12" r="10" opacity=".35"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/><circle cx="21.5" cy="12" r="1.2" fill="currentColor"/></svg>
  </button>
  <button id="btnLook" aria-label="Look" title="Look (C)">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 1.8-1 1.4-2-.5-1.1.2-2.3 1.5-2.3H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15.5" cy="7.5" r="1.2" fill="currentColor"/></svg>
  </button>
  <button id="btnSound" aria-pressed="false" aria-label="Sound" title="Sound (M)">
    <svg class="i" viewBox="0 0 24 24" id="soundIcon"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  </button>
  <button id="btnFit" aria-label="Fit the view" title="Fit the view (R)">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/></svg>
  </button>
  <button id="btnFull" aria-label="Fullscreen" title="Fullscreen (F)">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btnHide" aria-label="Hide controls" title="Hide controls (H)">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </button>
</nav>

<script>
/* ==== ASTRO CORE (shared by the page and tests) ====
   Planet positions from JPL's approximate Keplerian elements (Standish, valid 3000 BC to 3000 AD,
   good to a few arcminutes for the inner planets and better than a degree for the giants).
   Each row: a (AU), e, I, L, long. perihelion, long. node (deg), then the same per Julian century,
   then the extra mean-anomaly terms b, c, s, f for Jupiter to Pluto. */
const BODIES = [
  { key:'mercury', name:'Mercury', color:'#c7bccf', size:3.2,
    el:[0.38709843,0.20563661,7.00559432,252.25166724,77.45771895,48.33961819],
    rt:[0,0.00002123,-0.00590158,149472.67486623,0.15940013,-0.12214182] },
  { key:'venus', name:'Venus', color:'#ffe0a3', size:4.6,
    el:[0.72332102,0.00676399,3.39777545,181.97970850,131.76755713,76.67261496],
    rt:[-0.00000026,-0.00005107,0.00043494,58517.81560260,0.05679648,-0.27274174] },
  { key:'earth', name:'Earth', color:'#72c6ff', size:4.8,
    el:[1.00000018,0.01673163,-0.00054346,100.46691572,102.93005885,-5.11260389],
    rt:[-0.00000003,-0.00003661,-0.01337178,35999.37306329,0.31795260,-0.24123856] },
  { key:'mars', name:'Mars', color:'#ff7d5c', size:3.8,
    el:[1.52371243,0.09336511,1.85181869,-4.56813164,-23.91744784,49.71320984],
    rt:[0.00000097,0.00009149,-0.00724757,19140.29934243,0.45223625,-0.26852431] },

/* ---------- spirograph ---------- */
let spiroSegs = [], spiroKey = '', spiroNext = null;

function spiroStep(from, to){

  if (key !== spiroKey){ spiroKey = key; spiroReset(); }
  const gap = S.spiroGap, dir = to >= from ? 1 : -1;
  if (spiroNext == null || Math.abs(spiroNext - from) > gap * 2) spiroNext = (dir > 0 ? Math.ceil(from / gap) : Math.floor(from / gap)) * gap;

const withinToSlider = (w) => Math.log(w / .2) / Math.log(180 / .2) * 1000;
const sliderToWithin = (v) => { const w = .2 * Math.pow(180 / .2, v / 1000); return w < 10 ? Math.round(w * 10) / 10 : Math.round(w); };
$('#p-within').addEventListener('input', (e) => { S.within = sliderToWithin(+e.target.value); $('#o-within').textContent = fmtAngle(S.within); S.preset = ''; changedSoon(); });
function applyPreset(p){
  S.preset = p.id; S.chosen = p.chosen.slice(); S.view = p.view; S.line = p.line; S.within = p.within;
  if (p.spiro != null){ S.spiro = p.spiro; buildLook(); }
  if (p.speed != null) setSpeed(p.speed);
  spiroReset(); changed(true);
}
function toggleBody(i){
  if (S.view === 'earth' && i === EARTH) return;
  const k = S.chosen.indexOf(i);
  if (k >= 0) S.chosen.splice(k, 1); else S.chosen.push(i);
  S.chosen.sort((a, b) => a - b);
  S.preset = '';
  spiroReset(); changed();
}
let changeTimer = 0;
function changedSoon(){ clearTimeout(changeTimer); changeTimer = setTimeout(() => changed(), 220); }
function changed(keepPreset){
  const match = PRESETS.find((p) => p.chosen.join() === S.chosen.join() && p.view === S.view && p.line === S.line && p.within === S.within);
  S.preset = match ? match.id : '';
  save(); buildTrack(); layout(); startSearch(); renderReadout(true); syncVoices();
}

// Look & Sound panes, built from the tables
function buildPane(which){
  const pane = $('#pane-' + which); pane.innerHTML = '';
  const h = (t) => { const e = document.createElement('h3'); e.textContent = t; pane.appendChild(e); };
  CHOICES.filter((c) => c.tab === which).forEach((c) => {
    h(c.label); const row = document.createElement('div'); row.className = 'chips'; pane.appendChild(row);
    chipRow(row, c.opts, S[c.key], (v) => { S[c.key] = v; save(); buildPane(which); onSetting(c.key); });
  });
  h(which === 'look' ? 'Picture' : 'Voice');
  PARAMS.filter((p) => p.tab === which).forEach((p) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<label for="p-' + p.key + '">' + p.label + '</label><input type="range" id="p-' + p.key + '" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '"><output></output>';
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.value = S[p.key]; out.textContent = p.fmt(S[p.key]);
    inp.addEventListener('input', () => { S[p.key] = +inp.value; out.textContent = p.fmt(S[p.key]); save(); onSetting(p.key); });
    pane.appendChild(row);
  });
  h('Show');
  const row = document.createElement('div'); row.className = 'chips'; pane.appendChild(row);
  if (which === 'sound'){
    const b = document.createElement('button'); b.textContent = 'Sound on'; b.setAttribute('aria-pressed', S.sound);
    b.addEventListener('click', () => setSound(!S.sound)); row.appendChild(b);
  }
  TOGGLES.filter((t) => t.tab === which).forEach((t) => {
    const b = document.createElement('button'); b.textContent = t.label; b.setAttribute('aria-pressed', S[t.key]);
    b.addEventListener('click', () => { S[t.key] = !S[t.key]; save(); b.setAttribute('aria-pressed', S[t.key]); onSetting(t.key); });
    row.appendChild(b);
  });
  if (which === 'look'){
    const a = document.createElement('div'); a.className = 'actions';
    const clr = document.createElement('button'); clr.textContent = 'Clear spirograph'; clr.addEventListener('click', spiroReset);
    const rst = document.createElement('button'); rst.textContent = 'Reset look';
    rst.addEventListener('click', () => { const d = defaults(); [...PARAMS, ...CHOICES, ...TOGGLES].filter((x) => x.tab === 'look').forEach((x) => S[x.key] = d[x.key]); save(); buildPane('look'); onSetting('scale'); });
    a.append(clr, rst); pane.appendChild(a);
    const p = document.createElement('p'); p.className = 'small';
    p.innerHTML = 'Evenly spaced keeps every planet in view; true to scale shows real distances and stretched orbits (the view fits the outermost planet you track). Keys: Space play, [ ] speed, B backwards, N now, , . previous and next alignment, ← → a day (Shift: a month), R fit, F fullscreen, H hide, C look.';
    pane.appendChild(p);
  } else {
    const p = document.createElement('p'); p.className = 'small';
    p.textContent = 'Each tracked planet hums a note set by how fast it orbits (faster is higher), louder as they close in, and they chime together at the moment they line up.';
    pane.appendChild(p);
  }
}
function buildLook(){ buildPane('look'); }
function onSetting(k){
  if (k === 'scale' || k === 'pluto'){
    if (k === 'pluto' && !S.pluto){ S.chosen = S.chosen.filter((i) => i !== 8); if (S.chosen.length < 2) S.chosen = [2, 3]; changed(); }
    spiroReset(); orbitCache.jd = -1e9; buildTrack(); layout();
  }
  if (k === 'sky') layout();
  if (k === 'spiro') spiroReset();
  if (['vol', 'reverb', 'voice', 'bright', 'base', 'spread', 'tuning', 'drone'].includes(k)) syncVoices(true);
}

/* ---------- pointer: tap a planet to track it, drag one to wind time, drag space to pan, pinch to zoom ---------- */
const pointers = new Map();
let dragging = null, pinch = null;
function hitBody(x, y){
  let best = -1, bd = 26;
  shownBodies().forEach((i) => { const p = toScreen(...worldPos(i, jd)); const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd + BODIES[i].size * S.size * .5){ bd = d; best = i; } });
  return best;
}
cv.addEventListener('pointerdown', (e) => {
  unlockAudio(); dismissHint();
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: view.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, px: view.px, py: view.py };
    dragging = null; return;
  }
  const i = hitBody(e.clientX, e.clientY);
  dragging = { id: e.pointerId, body: i, x0: e.clientX, y0: e.clientY, px: view.px, py: view.py, moved: false, wasPlaying: S.playing };
  if (i >= 0) glide = null;
});
cv.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomAt(pinch.mx, pinch.my, clamp(pinch.zoom * d / pinch.d, .3, 60), pinch);
    view.px += mx - pinch.mx; view.py += my - pinch.my;
    return;
  }
  if (!dragging || dragging.id !== e.pointerId) return;
  if (!dragging.moved && Math.hypot(e.clientX - dragging.x0, e.clientY - dragging.y0) > 7){
    dragging.moved = true;
    if (dragging.body >= 0){ dragging.wasPlaying = S.playing; if (S.playing) setPlaying(false); }
  }
  if (!dragging.moved) return;
  if (dragging.body >= 0){
    // wind time so the planet follows the finger around its orbit
    const [sx, sy] = toScreen(0, 0);
    const want = wrap360(Math.atan2(sy - e.clientY, e.clientX - sx) / DEG);
    const b = BODIES[dragging.body];
    for (let k = 0; k < 3; k++){
      const dl = wrap180(want - helioLon(dragging.body, jd));
      const before = jd;
      setJd(jd + dl / b.n);
      spiroStep(before, jd);
    }
  } else {
    view.px = dragging.px + e.clientX - dragging.x0; view.py = dragging.py + e.clientY - dragging.y0;
  }
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pinch){ if (pointers.size < 2) pinch = null; dragging = null; return; }
  if (dragging && dragging.id === e.pointerId){
    if (!dragging.moved && dragging.body >= 0) toggleBody(dragging.body);
    if (dragging.moved && dragging.body >= 0) startSearchIfOut();
    dragging = null;
  }
}
function startSearchIfOut(){ if (jd > winHi || jd < winLo) startSearch(); renderReadout(true); }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
function zoomAt(x, y, z, base){
  base = base || { zoom: view.zoom, px: view.px, py: view.py };
  const k = z / base.zoom;
  view.px = (base.px - (x - cx)) * k + (x - cx);
  view.py = (base.py - (y - cy)) * k + (y - cy);
  view.zoom = z;
}
cv.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, clamp(view.zoom * Math.exp(-e.deltaY * .0015), .3, 60)); }, { passive: false });
function resetView(){ view.zoom = 1; view.px = 0; view.py = 0; layout(); }
$('#btnFit').addEventListener('click', resetView);

/* ---------- dock ---------- */
const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;
$('#btnFull').hidden = !fsOK;
function toggleFull(){
  if (!fsOK) return;
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
$('#btnFull').addEventListener('click', toggleFull);
function setUiHidden(h){
  document.body.classList.toggle('ui-hidden', h);
  $('#btnShow').hidden = !h;
  if (h) closeSheet();
  layout();
}
$('#btnHide').addEventListener('click', () => setUiHidden(true));
$('#btnShow').addEventListener('click', () => setUiHidden(false));
$('#btnSound').addEventListener('click', () => setSound(!S.sound));
let hintTimer = setTimeout(dismissHint, 9000);
function dismissHint(){ clearTimeout(hintTimer); $('#hint').classList.add('gone'); }

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); setPlaying(!S.playing); unlockAudio(); }
  else if (k === '[') setSpeed(S.speed - 1);
  else if (k === ']') setSpeed(S.speed + 1);
  else if (k === 'b' || k === 'B') setDir(-S.dir);
  else if (k === 'n' || k === 'N') glideTo(nowJd());
  else if (k === '.' || k === '>'){ const ev = nextEvent(); if (ev) glideTo(ev.jd, true); }
  else if (k === ',' || k === '<'){ const ev = prevEvent(); if (ev) glideTo(ev.jd, true); }
  else if (k === 'ArrowRight' || k === 'ArrowLeft'){ if (e.target.type === 'range') return; e.preventDefault(); setPlaying(false); setJd(jd + (k === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 30.4375 : 1)); startSearchIfOut(); }
  else if (k === 'r' || k === 'R') resetView();
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'h' || k === 'H') setUiHidden(!document.body.classList.contains('ui-hidden'));
  else if (k === 'c' || k === 'C') $('#sheet').classList.contains('open') && tab === 'look' ? closeSheet() : openSheet('look');
  else if (k === 'm' || k === 'M') setSound(!S.sound);
  else if (k === 'Escape') closeSheet();
});

/* ---------- sound: each tracked planet a voice pitched by its orbital speed ---------- */
let AC = null, master = null, wet = null, dry = null, filt = null, voices = new Map();
function unlockAudio(){
  if (!S.sound) return;
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C();
    master = AC.createGain(); master.gain.value = 0;
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = .5;
    dry = AC.createGain(); wet = AC.createGain();
    const conv = AC.createConvolver(); conv.buffer = impulse(3.2);
    filt.connect(dry); filt.connect(conv); conv.connect(wet);
    dry.connect(master); wet.connect(master); master.connect(comp); comp.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  syncVoices(true);
}
function impulse(sec){
  const n = Math.round(AC.sampleRate * sec), b = AC.createBuffer(2, n, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++){ const d = b.getChannelData(ch); for (let k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, 3.2); }
  return b;
}
function setSound(on){
  S.sound = on; save();
  $('#btnSound').setAttribute('aria-pressed', on);
  $('#soundIcon').innerHTML = on ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
  if (on) unlockAudio(); else syncVoices(true);
  if (!$('#pane-sound').hidden) buildPane('sound');
}
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function noteName(m){ return ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'][m % 12] + (Math.floor(m / 12) - 1); }
// Kepler's music: Neptune (slowest) sits on the lowest note, Mercury (fastest) at the top of the spread.
function pitchOf(i){
  const lo = Math.log2(BODIES[8].n), hi = Math.log2(BODIES[0].n);
  const semis = (Math.log2(BODIES[i].n) - lo) / (hi - lo) * S.spread * 12;
  let m = S.base + semis;
  if (S.tuning !== 'free'){
    const steps = S.tuning === 'penta' ? [0, 2, 4, 7, 9] : [0, 2, 4, 5, 7, 9, 11];
    const oct = Math.floor(semis / 12), r = semis - oct * 12;
    let best = 0; steps.concat(12).forEach((s) => { if (Math.abs(s - r) < Math.abs(best - r)) best = s; });
    m = S.base + oct * 12 + best;
    if (S.tuning === 'just'){ const just = { 0: 1, 2: 9 / 8, 4: 5 / 4, 5: 4 / 3, 7: 3 / 2, 9: 5 / 3, 11: 15 / 8, 12: 2 }; return midiHz(S.base) * Math.pow(2, oct) * just[best]; }
  }
  return midiHz(m);
}
const WAVES = { glass: 'sine', warm: 'triangle', choir: 'sawtooth', bell: 'sine' };
function syncVoices(rebuild){
  if (!AC) return;
  const t = AC.currentTime, on = S.sound;
  master.gain.setTargetAtTime(on ? S.vol * .5 : 0, t, .08);
  wet.gain.setTargetAtTime(S.reverb * .9, t, .1); dry.gain.setTargetAtTime(1 - S.reverb * .45, t, .1);
  filt.frequency.setTargetAtTime(500 + Math.pow(S.bright, 2) * 9000, t, .1);
  const want = new Set(on && S.drone > 0 ? members(cfg()) : []);
  for (const [i, v] of voices){
    if (!want.has(i) || rebuild){ v.g.gain.setTargetAtTime(0, t, .15); const o = v.o; setTimeout(() => o.forEach((x) => { try { x.stop(); } catch (e) {} }), 900); voices.delete(i); }
  }
  want.forEach((i) => {
    if (voices.has(i)) return;
    const f = pitchOf(i), g = AC.createGain(), pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    g.gain.value = 0;
    const o = [0, 1].map((k) => { const x = AC.createOscillator(); x.type = WAVES[S.voice]; x.frequency.value = f * (k ? 1.004 : 1); x.connect(g); x.start(); return x; });
    if (S.voice === 'glass' || S.voice === 'bell'){ o[1].frequency.value = f * 2.001; }
    if (pan){ g.connect(pan); pan.connect(filt); } else g.connect(filt);
    voices.set(i, { o, g, pan });
  });
}
// Each frame: drone voices swell as the tracked planets close in, and pan with each planet's direction.
function updateDrone(span){
  if (!AC || !S.sound || !voices.size) return;
  const t = AC.currentTime, close = clamp(1 - span / Math.max(S.within * 5, 30), 0, 1);
  const n = voices.size, lvl = S.drone * (.05 + .3 * close * close) / Math.sqrt(n) * (S.voice === 'choir' ? .35 : 1);
  for (const [i, v] of voices){
    v.g.gain.setTargetAtTime(lvl, t, .12);
    if (v.pan) v.pan.pan.setTargetAtTime(Math.cos(helioLon(i, jd) * DEG) * .7, t, .2);
  }
}
function chime(){
  if (!AC || !S.sound || !S.chime) return;
  const t0 = AC.currentTime + .02, m = members(cfg());
  const parts = S.voice === 'bell' ? [[1, 1], [2.76, .45], [5.4, .25], [8.93, .12]] : S.voice === 'choir' ? [[1, 1], [2, .4], [3, .25]] : S.voice === 'warm' ? [[1, 1], [2, .3]] : [[1, 1], [2.01, .35], [4.02, .12]];
  m.forEach((i, k) => {
    const f = pitchOf(i) * 2, t = t0 + k * .07;
    const g = AC.createGain(); g.connect(filt);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32 / Math.sqrt(m.length), t + .012); g.gain.exponentialRampToValueAtTime(.0005, t + S.ring);
    parts.forEach(([r, a]) => {
      const o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine'; o.frequency.value = f * r; og.gain.value = a * (r > 1 ? (.3 + S.bright) : 1);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + S.ring + .1);
    });
  });
}

/* ---------- main loop ---------- */
let lastT = 0;
function frame(now){
  const dt = Math.min(.1, lastT ? (now - lastT) / 1000 : 1 / 60); lastT = now;
  lastJd = jd;
  if (glide){
    const u = clamp((now - glide.t0) / glide.dur, 0, 1), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    jd = glide.from + (glide.to - glide.from) * e;
    if (u >= 1){
      jd = glide.to; glide = null; startSearchIfOut();
      const hit = events.find((ev) => Math.abs(ev.jd - jd) < 1e-3);
      if (hit){ flash = 1; chime(); }
    }
  } else if (S.playing && !dragging?.moved){
    const real = SPEEDS[S.speed][0] === 1 / 86400 && S.dir > 0 && Math.abs(jd - nowJd()) < 1 / 1440;
    setJd(real ? nowJd() : jd + SPEEDS[S.speed][0] * dt * S.dir);
    spiroStep(lastJd, jd);
    // passing an alignment: flash and chime
    const lo = Math.min(lastJd, jd), hi = Math.max(lastJd, jd);
    if (events.some((ev) => ev.jd > lo && ev.jd <= hi)){ flash = 1; chime(); }
    if (jd <= JD_MIN || jd >= JD_MAX) setPlaying(false);
  }
  flash = Math.max(0, flash - dt * .7);
  maybeResearch();
  draw();
  const m = members(cfg());
  updateDrone(m.length >= 2 ? spanAt(cfg(), jd, m) : 180);
  renderReadout();
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
buildTrack(); buildPane('look'); buildPane('sound');
setPlaying(S.playing); setDir(S.dir); setSound(S.sound);
addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(layout);
layout();
startSearch();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : (S.sound && AC.resume()); });
</script>
</body>
</html>
