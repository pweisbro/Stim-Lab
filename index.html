<style>
/* Layout: a quiet, native-feeling page (system type, graphite wall) holding one dark window per app.
   Each window runs a small live preview drawn in that app's own colors; the apps carry the personality. */
:root{
  color-scheme: dark;
  --wall:#1b1b1e;
  --line:#2e2e33;
  --text:#f3f3f5;
  --muted:#a3a3ab;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sys-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gutter:max(clamp(16px,4vw,32px),env(safe-area-inset-left,0px));
  --gutter-r:max(clamp(16px,4vw,32px),env(safe-area-inset-right,0px));
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--wall)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--wall);color:var(--text);
  font:400 16px/1.45 var(--sys);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.page{
  max-width:1200px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + clamp(22px,5vw,48px)) var(--gutter-r) calc(env(safe-area-inset-bottom,0px) + 28px) var(--gutter);
}

.masthead{margin:0 0 clamp(18px,3vw,28px)}
.masthead h1{margin:0;font:700 clamp(34px,5vw,46px)/1.05 var(--sys-display);letter-spacing:-.022em}
.masthead p{margin:8px 0 0;max-width:46ch;color:var(--muted);font-size:15px}

.shelf{list-style:none;margin:0;padding:0;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}

.tile{
  position:relative;display:flex;flex-direction:column;height:100%;
  border-radius:22px;overflow:hidden;
  background:var(--ground,#0a0a0c);color:var(--text);text-decoration:none;
  transition:transform .14s ease-out;
}
/* the hairline sits above the preview so the canvas never covers it */
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--edge,rgba(255,255,255,.1));transition:box-shadow .2s}
.tile:hover::after{box-shadow:inset 0 0 0 1px var(--edge-hi,rgba(255,255,255,.22))}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:2px solid var(--accent,#fff);outline-offset:3px}

.art{position:relative;aspect-ratio:16/10;background:var(--ground,#0a0a0c)}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.label{padding:14px 18px 18px}
.label h2{margin:0;font:700 22px/1.1 var(--sys-display);letter-spacing:-.01em}
.label p{margin:7px 0 0;color:var(--muted);font-size:15px;line-height:1.4;max-width:52ch}

/* Spectrum Bench's own wordmark: tracked condensed caps over its spectrum hairline */
.label h2.t-bench{display:inline-block;font:600 22px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase}
.label h2.t-bench::after{content:"";display:block;height:2px;margin-top:7px;border-radius:1px;opacity:.85;
  background:linear-gradient(90deg,#6a00b0,#2a2aff,#00c8ff,#00ff40,#ffff00,#ff8000,#ff0000)}
/* Resonant Ink's own wordmark */
.label h2.t-ink{font:800 24px/1.05 "Bricolage Grotesque","Avenir Next",system-ui,sans-serif;letter-spacing:-.015em}
/* Drift Pad's own wordmark */
.label h2.t-pad{font:800 23px/1.05 "Syne","Avenir Next",system-ui,sans-serif;letter-spacing:-.01em}
/* Gravity Wells' own wordmark */
.label h2.t-wells{font:700 21px/1.1 "Unbounded","Avenir Next",system-ui,sans-serif;letter-spacing:-.01em}
.label h2.t-grain{font:400 19px/1.15 "Silkscreen",ui-monospace,Menlo,monospace;letter-spacing:.06em}
/* X-Y Scope's own wordmark */
.label h2.t-scope{font:500 20px/1.1 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#8dff72}
.label h2.t-worm{font:700 29px/1 "Caveat","Bradley Hand",cursive;letter-spacing:.01em;color:#ffe3d3}
.label h2.t-beam{font:700 21px/1.1 "Chakra Petch","Avenir Next Condensed",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.label h2.t-beam span{color:#39ff7a;text-shadow:0 0 10px rgba(57,255,122,.5)}
.label h2.t-fold{font:400 24px/1.05 "Righteous","Avenir Next",system-ui,sans-serif;letter-spacing:.02em;
  background:linear-gradient(90deg,#ff6fd8,#c39bff 45%,#7af0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.label h2.t-doom{font:700 30px/.9 "Teko","Impact",sans-serif;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#ffd27a,#ff7a2e 45%,#c81e14);-webkit-background-clip:text;background-clip:text;color:transparent}
.label h2.t-orrery{font:600 23px/1.1 "Fredoka","Avenir Next",system-ui,sans-serif;letter-spacing:.01em}

.foot{margin-top:28px;font-size:14px;color:var(--muted)}
.foot a{color:var(--muted);text-underline-offset:3px}
.foot a:hover{color:var(--text)}
.foot a:focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:3px}

@media (prefers-reduced-motion:reduce){.tile,.tile::after{transition:none}.tile:active{transform:none}}
</style>

<script>
/* ------------------------------------------------------------------
   THE APP LIST. To add an app: put its page next to this one, add an
   entry here, and list the page in sw.js. Only name, href and blurb are
   required; without `art` the tile gets a soft glow in its accent color.
   ------------------------------------------------------------------ */
const APPS = [
  {
    name: 'Spectrum Bench',
    href: 'spectrum-bench.html',
    blurb: 'Shine light through prisms, lenses, liquid, mirrors, gratings and even a black hole, and watch it split into color. Play music and the three Music prisms tilt and swell with the bass, mids and highs. Pinch to zoom, and send setups to TouchDesigner.',
    ground: '#0a0c10',
    accent: '#ffb340',
    titleClass: 't-bench',
    art: 'prism'
  },
  {
    name: 'Resonant Ink',
    href: 'resonant-ink.html',
    blurb: 'Stir glowing dye with your fingers, then turn it into oil paint, comic ink, chrome or neon with shader effects. It pulses to a song, a demo beat or the microphone, and your looks save as shareable presets.',
    ground: '#05060a',
    accent: '#9fdcff',
    titleClass: 't-ink',
    art: 'ink'
  },
  {
    name: 'Drift Pad',
    href: 'drift-pad.html',
    blurb: 'Tap twenty glowing pads to play ambient tones on glass, steel drum, gong, choir and more, or build your own instrument. Set pads looping at their own lengths, or let it drift and play itself.',
    ground: '#0b0a12',
    accent: '#c9b8ff',
    titleClass: 't-pad',
    art: 'pad'
  },
  {
    name: 'Gravity Wells',
    href: 'gravity-wells.html',
    blurb: 'Every finger is a little sun. Pull thousands of sparks into orbit, push or swirl them, tilt the device to pour them around, and let a heavy well collapse into a shockwave.',
    ground: '#04050b',
    accent: '#ffc56b',
    titleClass: 't-wells',
    art: 'wells'
  },
  {
    name: 'Grainfall',
    href: 'grainfall.html',
    blurb: 'Pour sand, water, lava, gunpowder and over a dozen more materials onto a clay TV in a moonlit bedroom, and watch them burn, melt, grow and explode. Lean the device to look around the room.',
    ground: '#2e2d57',
    accent: '#a6e3cc',
    titleClass: 't-grain',
    art: 'grain'
  },
  {
    name: 'Little Orrery',
    href: 'little-orrery.html',
    blurb: 'A clay solar system floating in a starfield, with dwarf planets, moons, space probes and landing sites. Spin it, tap anything to follow it, and switch to true scale for real sizes and stretched orbits.',
    ground: '#262649',
    accent: '#ffd3b0',
    titleClass: 't-orrery',
    art: 'orrery'
  },
  {
    name: 'X-Y Scope',
    href: 'xy-scope.html',
    blurb: 'Draw with sound on a glowing oscilloscope: Lissajous knots, a spinning cube, your own drawings or typed words. It opens on a YouTube song that draws mushrooms, and what you see is exactly what plays, so it can drive a real scope.',
    ground: '#060b08',
    accent: '#8dff72',
    titleClass: 't-scope',
    art: 'scope'
  },
  {
    name: 'Earworm',
    href: 'earworm.html',
    blurb: 'Get the song out of your head. Hum the melody, the bass and a beat one at a time, watch each turn into notes, then swap instruments, arrange the sections into a song and export it as MIDI.',
    ground: '#17151d',
    accent: '#ff7a59',
    titleClass: 't-worm',
    art: 'worm'
  },
  {
    name: 'Beamline',
    href: 'beamline.html',
    blurb: 'Plan a laser show to music. Sketch shapes, words, waveforms and beam fans, make them react to the song or drop in EDM presets, and export ILDA files for a real laser.',
    ground: '#05050a',
    accent: '#39ff7a',
    titleClass: 't-beam',
    art: 'beam'
  },
  {
    name: 'Mirrorfold',
    href: 'mirrorfold.html',
    blurb: 'Fly through fractals made of mirrors folded over and over, with glowing trails that feed back into themselves. Bend it with a finger, roll a surprise look, let sound push any setting, and bookmark or share what you find.',
    ground: '#07060d',
    accent: '#ff6fd8',
    titleClass: 't-fold',
    art: 'fold'
  },
  {
    name: 'DOOM',
    href: 'doom.html',
    blurb: 'The real 1993 DOOM engine, running right here. The shareware episode is built in, or add your own WAD for the full game, DOOM II or Freedoom, with saved games and touch controls on iPhone and iPad.',
    ground: '#0b0302',
    accent: '#ff5a1f',
    titleClass: 't-doom',
    art: 'doomfire'
  }
];

/* ---------- helpers ---------- */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
// Visible wavelength (nm) to an RGB string, after Dan Bruton's approximation.
function waveColor(nm, a){
  let r = 0, g = 0, b = 0;
  if (nm < 440){ r = (440 - nm) / 60; b = 1; }
  else if (nm < 490){ g = (nm - 440) / 50; b = 1; }
  else if (nm < 510){ g = 1; b = (510 - nm) / 20; }
  else if (nm < 580){ r = (nm - 510) / 70; g = 1; }
  else if (nm < 645){ r = 1; g = (645 - nm) / 65; }
  else { r = 1; }
  let f = 1;
  if (nm < 420) f = .3 + .7 * (nm - 380) / 40; else if (nm > 680) f = .3 + .7 * (720 - nm) / 40;
  const c = (v) => Math.round(255 * Math.pow(v * f, .8));
  return 'rgba(' + c(r) + ',' + c(g) + ',' + c(b) + ',' + a + ')';
}

/* ---------- previews ----------
   Each preview is { init(state, w, h), frame(ctx, state, w, h, t, dt) } in CSS pixels. */
const ARTS = {};

// Music prisms, the bench's starter setup: one white beam through a triangle (bass), a hexagon (mids)
// and a right-angle prism (highs) onto a screen. A made-up song tilts and swells each prism with its own
// part, and the beam in carries the waveform. Real Snell's-law dispersion, a little exaggerated.
// Ray tracing in 2D, shared helpers: follow one ray through convex glass shapes, refracting in and out
// (or reflecting when it can't get out), until it meets the screen or leaves.
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1];
const vnorm = (a) => { const l = Math.hypot(a[0], a[1]); return [a[0] / l, a[1] / l]; };
function prismShape(shape, c, r, rot){
  let angs;
  if (shape === 'tri') angs = [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6].map((a) => [a, r]);
  else if (shape === 'hex') angs = [0, 1, 2, 3, 4, 5].map((i) => [i * Math.PI / 3, r]);
  else angs = [[-Math.PI * 3 / 4, r], [-Math.PI / 4, r], [Math.PI / 2, r * .7071]];
  const pts = angs.map(([a, rr]) => [c[0] + rr * Math.cos(a + rot), c[1] + rr * Math.sin(a + rot)]);
  return { pts, c: [pts.reduce((v, q) => v + q[0], 0) / pts.length, pts.reduce((v, q) => v + q[1], 0) / pts.length] };
}
function segHit(o, d, a, b){
  const e = vsub(b, a), den = d[0] * e[1] - d[1] * e[0];
  if (Math.abs(den) < 1e-9) return null;
  const ao = vsub(a, o), tt = (ao[0] * e[1] - ao[1] * e[0]) / den, u = (ao[0] * d[1] - ao[1] * d[0]) / den;
  return (tt > 1e-6 && u >= 0 && u <= 1) ? tt : null;
}
function traceRay(o, d, n, polys, scr, far){
  const path = [o];
  for (let bounce = 0; bounce < 12; bounce++){
    let best = null, nrm = null, onScreen = false;
    for (const pg of polys) for (let i = 0; i < pg.pts.length; i++){
      const a = pg.pts[i], b = pg.pts[(i + 1) % pg.pts.length], tt = segHit(o, d, a, b);
      if (tt === null || (best !== null && tt >= best)) continue;
      const e = vnorm(vsub(b, a)); let nn = [e[1], -e[0]];
      if (vdot(nn, vsub([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], pg.c)) < 0) nn = [-nn[0], -nn[1]];
      best = tt; nrm = nn;
    }
    const ts = scr ? segHit(o, d, scr[0], scr[1]) : null;
    if (ts !== null && (best === null || ts < best)){ best = ts; onScreen = true; }
    if (best === null){ path.push([o[0] + d[0] * far, o[1] + d[1] * far]); return { path, d }; }
    const q = [o[0] + d[0] * best, o[1] + d[1] * best];
    path.push(q);
    if (onScreen) return { path, land: q, d };
    const entering = vdot(d, nrm) < 0, nf = entering ? nrm : [-nrm[0], -nrm[1]], eta = entering ? 1 / n : n;
    const ci = -vdot(nf, d), kk = 1 - eta * eta * (1 - ci * ci);
    d = kk < 0 ? vnorm([d[0] + 2 * ci * nf[0], d[1] + 2 * ci * nf[1]])
      : vnorm([eta * d[0] + (eta * ci - Math.sqrt(kk)) * nf[0], eta * d[1] + (eta * ci - Math.sqrt(kk)) * nf[1]]);
    o = q;
  }
  return { path, d };
}
const glassIndex = (nm) => 1.5 + .016 / (nm * nm / 1e6);
ARTS.prism = {
  // shape, size, turn, distance along the beam from the last piece, and sideways offset from the beam
  parts: [['tri', 1, 0, 2, .2], ['hex', .85, .26, 1.8, -.3], ['right', 1, Math.PI, 1.8, .2]],
  init(s, w, h){
    s.holes = [];
    for (let y = 12; y < h; y += 22) for (let x = 12; x < w; x += 22) s.holes.push(x, y);
    // lay the pieces out along the beam at rest, so it threads all three, then fit that into the tile
    s.dir = -.55; s.place = [];
    let o = [0, 0], d = [Math.cos(s.dir), Math.sin(s.dir)];
    const pts = [o];
    for (const [shape, r, rot, D, off] of this.parts){
      const c = [o[0] + d[0] * D - d[1] * off, o[1] + d[1] * D + d[0] * off];
      const pg = prismShape(shape, c, r, rot);
      const res = traceRay(o, d, glassIndex(550), [pg], null, 1);
      s.place.push({ shape, r, rot, c });
      pts.push(...pg.pts);
      o = res.path[res.path.length - 2]; d = res.d;
    }
    const sc = [o[0] + d[0] * 1.7, o[1] + d[1] * 1.7], half = 1.1;
    s.scr = [[sc[0] + d[1] * half, sc[1] - d[0] * half], [sc[0] - d[1] * half, sc[1] + d[0] * half]];
    pts.push(...s.scr, [-.6, 0]);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts){ x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const m = 20;
    s.k = Math.min((w - m * 2) / (x1 - x0), (h - m * 2) / (y1 - y0));
    s.ox = (w - (x1 - x0) * s.k) / 2 - x0 * s.k; s.oy = (h - (y1 - y0) * s.k) / 2 - y0 * s.k;
  },
  frame(ctx, s, w, h, t){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(221,225,231,.05)';
    for (let i = 0; i < s.holes.length; i += 2){ ctx.beginPath(); ctx.arc(s.holes[i], s.holes[i + 1], 1.1, 0, 7); ctx.fill(); }

    // a pretend song at 112 bpm: a kick on every beat, a slow swell in the mids, hats on the eighths
    const beat = t * 112 / 60, ph = beat % 1, ph8 = (beat * 2) % 1;
    const level = [Math.exp(-ph * 5), .5 + .5 * Math.sin(beat * Math.PI / 4), Math.exp(-ph8 * 9) * (.6 + .4 * Math.sin(t * 5))];
    const polys = s.place.map((p, i) => prismShape(p.shape, p.c, p.r * (1 + .12 * level[i]), p.rot + .07 * (level[i] - .5)));
    const P = (q) => [s.ox + q[0] * s.k, s.oy + q[1] * s.k];
    const line = (path) => { ctx.beginPath(); path.forEach((q, i) => { q = P(q); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); };

    const d0 = [Math.cos(s.dir), Math.sin(s.dir)];
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const lands = [];
    let first = null;
    for (let nm = 400; nm <= 700; nm += 7.5){
      const { path, land } = traceRay([0, 0], d0, glassIndex(nm), polys, s.scr, 30);
      if (!first) first = path[1];
      if (land) lands.push([P(land), nm]);
      // the colors only part after the first prism, so the white beam in is drawn on its own below
      line(path.slice(1));
      ctx.strokeStyle = waveColor(nm, .045); ctx.lineWidth = 6; ctx.stroke();
      ctx.strokeStyle = waveColor(nm, .42); ctx.lineWidth = 1.3; ctx.stroke();
    }
    // the white beam in, carrying the song's waveform like the bench's oscilloscope trace
    const S = P([0, 0]), F = P(first), len = Math.hypot(F[0] - S[0], F[1] - S[1]), nx = -d0[1], ny = d0[0], amp = 2 + 5 * level[0];
    ctx.beginPath();
    for (let i = 0; i <= 90; i++){
      const u = i / 90, env = Math.min(1, u * 6, (1 - u) * 6);
      const o = amp * env * (Math.sin(u * len * .2 - t * 9) * .7 + Math.sin(u * len * .55 - t * 17) * .4 * level[2]);
      const x = S[0] + d0[0] * u * len + nx * o, y = S[1] + d0[1] * u * len + ny * o;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (const [lw, a] of [[7, .07], [2, .9]]){ ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.lineWidth = lw; ctx.stroke(); }
    for (const [q, nm] of lands){ ctx.fillStyle = waveColor(nm, .2); ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, 7); ctx.fill(); }

    ctx.globalCompositeOperation = 'source-over';
    for (const pg of polys){
      line(pg.pts); ctx.closePath();
      ctx.fillStyle = 'rgba(200,210,230,.08)'; ctx.fill();
      ctx.strokeStyle = 'rgba(221,232,255,.45)'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    line(s.scr); ctx.strokeStyle = 'rgba(235,238,245,.7)'; ctx.lineWidth = 2.5; ctx.stroke();
    // the light, with the bench's amber turning knob
    ctx.save(); ctx.translate(S[0], S[1]); ctx.rotate(s.dir);
    ctx.fillStyle = '#191d24'; ctx.strokeStyle = 'rgba(221,225,231,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-22, -7, 24, 14, 3) : ctx.rect(-22, -7, 24, 14); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffb340'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-28, 0, 3.5, 0, 7); ctx.stroke();
    ctx.restore();
  }
};

// Four colored dyes poured from drifting points and carried by a handful of vortices;
// every couple of seconds a beat pushes a ripple outward, like the app's audio-reactive spots.
ARTS.ink = {
  hues: [185, 300, 250, 55],
  emitter(k, w, h, t){
    return [w * (.5 + .34 * Math.sin(t * (.11 + .03 * k) + k * 1.7)), h * (.5 + .32 * Math.cos(t * (.09 + .025 * k) + k * 2.3))];
  },
  init(s, w, h){
    const n = Math.round(Math.min(1400, Math.max(420, w * h / 60)));
    s.p = new Float32Array(n * 5); // x, y, hue jitter, life, speed scale
    s.t = s.t || 0; s.frameN = 0;
    for (let i = 0; i < n; i++) this.spawn(s, i, w, h, .35);
    s.nextBeat = 1.2; s.pulse = null;
  },
  spawn(s, i, w, h, spread){
    const o = i * 5, m = Math.min(w, h);
    const [ex, ey] = this.emitter(i % 4, w, h, s.t);
    const r = m * (spread || .1) * Math.sqrt(Math.random()), a = Math.random() * 6.283;
    s.p[o] = ex + r * Math.cos(a); s.p[o + 1] = ey + r * Math.sin(a); s.p[o + 2] = Math.random() * 30 - 15;
    s.p[o + 3] = 2.5 + Math.random() * 5; s.p[o + 4] = .75 + Math.random() * .5;
  },
  frame(ctx, s, w, h, t, dt){
    s.t = t;
    // Slow fade leaves long, curling trails, like dye that hasn't mixed in yet. Fading toward transparent
    // (not toward a painted color) lets the tile's own ground show through, so the colors always match.
    // Every eighth frame fades harder so faint leftovers don't linger as gray streaks.
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = (++s.frameN % 8) ? 'rgba(0,0,0,.045)' : 'rgba(0,0,0,.14)';
    ctx.fillRect(0, 0, w, h);

    const m = Math.min(w, h);
    const vort = [
      [w * (.5 + .3 * Math.sin(t * .21)), h * (.5 + .28 * Math.cos(t * .17)), 1],
      [w * (.5 + .32 * Math.cos(t * .13 + 2)), h * (.5 + .3 * Math.sin(t * .19 + 1)), -1],
      [w * (.5 + .22 * Math.sin(t * .27 + 4)), h * (.5 + .22 * Math.sin(t * .11 + 3)), 1]
    ];
    const r2 = (m * .14) * (m * .14), strength = m * 1.4;

    if (t > s.nextBeat){
      s.nextBeat = t + 1.8 + Math.random() * 1.4;
      s.pulse = { x: w * (.25 + Math.random() * .5), y: h * (.25 + Math.random() * .5), age: 0 };
    }
    let pk = 0, pr = 0;
    if (s.pulse){
      s.pulse.age += dt;
      if (s.pulse.age > 1.2) s.pulse = null;
      else { pk = Math.pow(1 - s.pulse.age / 1.2, 2); pr = m * (.08 + s.pulse.age * .5); }
    }

    const drift = 25 * Math.sin(t * .05);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.2;
    const p = s.p, n = p.length / 5;
    for (let i = 0; i < n; i++){
      const o = i * 5;
      const x = p[o], y = p[o + 1];
      let vx = 0, vy = 0;
      for (const [vx0, vy0, sg] of vort){
        const dx = x - vx0, dy = y - vy0, k = sg * strength / (dx * dx + dy * dy + r2);
        vx += -dy * k; vy += dx * k;
      }
      vx += m * .05 * Math.sin(y / m * 3 + t * .4);
      vy += m * .05 * Math.cos(x / m * 3 - t * .3);
      let glow = 0;
      if (pk){ // the beat's ripple: push dye outward near the expanding ring and brighten it
        const dx = x - s.pulse.x, dy = y - s.pulse.y, d = Math.hypot(dx, dy) + 1e-3;
        const ring = Math.exp(-Math.pow((d - pr) / (m * .12), 2)) * pk;
        vx += dx / d * ring * m * .45; vy += dy / d * ring * m * .45; glow = ring;
      }
      const sp = p[o + 4];
      const nx = x + vx * dt * sp, ny = y + vy * dt * sp;
      if ((p[o + 3] -= dt) <= 0 || nx < -10 || ny < -10 || nx > w + 10 || ny > h + 10){ this.spawn(s, i, w, h); continue; }
      ctx.strokeStyle = 'hsla(' + (this.hues[i % 4] + drift + p[o + 2]) + ',95%,' + (55 + glow * 20) + '%,' + (.2 + glow * .25) + ')';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
      p[o] = nx; p[o + 1] = ny;
    }
  }
};

// Twenty pads, low notes bottom left rising to the top right as in the app. A wandering melody (Drift)
// lights them one by one, and three pads loop at their own lengths, a ring sweeping round once per loop.
ARTS.pad = {
  init(s, w, h){
    s.cols = 5; s.rows = 4;
    s.lit = new Float32Array(s.cols * s.rows);
    s.ripples = []; s.walk = 8; s.next = .3;
    s.loops = [{ i: 2, len: 5.3 }, { i: 11, len: 7.9 }, { i: 17, len: 11.2 }].map((l) => ({ ...l, last: -1 }));
  },
  frame(ctx, s, w, h, t, dt){
    const { cols, rows } = s;
    const hit = (i) => { s.lit[i] = 1; s.ripples.push({ i, age: 0 }); if (s.ripples.length > 12) s.ripples.shift(); };
    if (t > s.next || s.next - t > 5){
      s.next = t + .5 + Math.random() * .7;
      s.walk = Math.max(0, Math.min(cols * rows - 1, s.walk + [-2, -1, -1, 1, 1, 2, cols, -cols][Math.floor(Math.random() * 8)]));
      hit(s.walk);
    }
    for (const l of s.loops){ const k = Math.floor(t / l.len); if (k !== l.last){ l.last = k; hit(l.i); } }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0b0a12'; ctx.fillRect(0, 0, w, h);
    const pad = Math.min(w, h) * .08, gap = Math.min(w, h) * .04;
    const cw = (w - pad * 2 - gap * (cols - 1)) / cols, ch = (h - pad * 2 - gap * (rows - 1)) / rows;
    const cell = (i) => [pad + (i % cols) * (cw + gap), pad + (rows - 1 - Math.floor(i / cols)) * (ch + gap)];
    const hue = (i) => 190 + 145 * i / (cols * rows - 1);
    ctx.globalCompositeOperation = 'lighter';
    for (const r of s.ripples){
      r.age += dt;
      const [x, y] = cell(r.i), cx = x + cw / 2, cy = y + ch / 2, u = r.age / 2.6;
      if (u >= 1) continue;
      const rad = Math.max(cw, ch) * (.5 + u * 2.4);
      const g = ctx.createRadialGradient(cx, cy, rad * .55, cx, cy, rad);
      g.addColorStop(0, 'hsla(' + hue(r.i) + ',90%,65%,0)');
      g.addColorStop(.82, 'hsla(' + hue(r.i) + ',90%,68%,' + (.22 * (1 - u) * (1 - u)).toFixed(3) + ')');
      g.addColorStop(1, 'hsla(' + hue(r.i) + ',90%,68%,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.fill();
    }
    s.ripples = s.ripples.filter((r) => r.age < 2.6);
    ctx.globalCompositeOperation = 'source-over';
    const rr = Math.min(cw, ch) * .2;
    for (let i = 0; i < cols * rows; i++){
      const [x, y] = cell(i), L = s.lit[i];
      s.lit[i] = Math.max(0, L - dt * .75);
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, cw, ch, rr) : ctx.rect(x, y, cw, ch);
      ctx.fillStyle = '#15131f'; ctx.fill();
      if (L > 0){ ctx.fillStyle = 'hsla(' + hue(i) + ',95%,68%,' + (L * L * .9).toFixed(3) + ')'; ctx.fill(); }
      ctx.strokeStyle = 'hsla(' + hue(i) + ',80%,80%,' + (.1 + L * .4).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.stroke();
    }
    // loop rings
    for (const l of s.loops){
      const [x, y] = cell(l.i), u = (t % l.len) / l.len, r = Math.min(cw, ch) * .3;
      ctx.strokeStyle = 'hsla(' + hue(l.i) + ',90%,80%,.2)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + cw / 2, y + ch / 2, r, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'hsla(' + hue(l.i) + ',95%,82%,.85)';
      ctx.beginPath(); ctx.arc(x + cw / 2, y + ch / 2, r, -Math.PI / 2, -Math.PI / 2 + u * 6.2832); ctx.stroke();
    }
  }
};

// Sparks orbiting two drifting wells, colored by speed like the app; now and then a well lets go in a shockwave.
ARTS.wells = {
  palette: ['#2a3cff', '#40c4ff', '#7ff0ff', '#e8fbff', '#ffe2a0', '#ffb347'],
  init(s, w, h){
    const n = Math.round(Math.min(900, Math.max(350, w * h / 80)));
    s.p = new Float32Array(n * 4);
    s.fresh = true; s.bang = null;
  },
  frame(ctx, s, w, h, t, dt){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4,5,11,.22)'; ctx.fillRect(0, 0, w, h);
    const m = Math.min(w, h);
    const wells = [
      [w * (.5 + .26 * Math.sin(t * .37)), h * (.5 + .22 * Math.cos(t * .29))],
      [w * (.5 + .26 * Math.sin(t * .37 + Math.PI)), h * (.5 + .22 * Math.cos(t * .29 + Math.PI))]
    ];
    if (s.fresh){ // start already in orbit around the wells, so the tile is lively from the first frame
      s.fresh = false; s.nextBang = t + 3;
      const G0 = m * m * 5, soft0 = (m * .05) ** 2, n0 = s.p.length / 4;
      for (let i = 0; i < n0; i++){
        const o = i * 4, [cx, cy] = wells[i % 2];
        const r = m * (.06 + Math.random() * .4), a = Math.random() * 6.283;
        const v = Math.sqrt(G0 * r * r / Math.pow(r * r + soft0, 1.5)) * (.8 + Math.random() * .3);
        s.p[o] = cx + Math.cos(a) * r; s.p[o + 1] = cy + Math.sin(a) * r;
        s.p[o + 2] = -Math.sin(a) * v; s.p[o + 3] = Math.cos(a) * v;
      }
    }
    if (t > s.nextBang){ s.nextBang = t + 4 + Math.random() * 2; s.bang = { x: wells[0][0], y: wells[0][1], age: 0 }; }
    if (s.bang && (s.bang.age += dt) > .8) s.bang = null;
    const G = m * m * 5, soft2 = (m * .05) ** 2, drag = Math.exp(-dt * .3), bs = m * 1.4 / this.palette.length;
    const segs = this.palette.map(() => []);
    const p = s.p, n = p.length / 4;
    for (let i = 0; i < n; i++){
      const o = i * 4, x = p[o], y = p[o + 1];
      let ax = 0, ay = 0;
      for (const [cx, cy] of wells){
        const dx = cx - x, dy = cy - y, r2 = dx * dx + dy * dy + soft2, f = G / (r2 * Math.sqrt(r2));
        ax += dx * f; ay += dy * f;
      }
      if (s.bang){
        const dx = x - s.bang.x, dy = y - s.bang.y, d = Math.hypot(dx, dy) + 1;
        const ring = Math.exp(-(((d - m * (.05 + s.bang.age * 1.2)) / (m * .1)) ** 2)) * (1 - s.bang.age / .8);
        ax += dx / d * ring * m * 30; ay += dy / d * ring * m * 30;
      }
      let u = (p[o + 2] + ax * dt) * drag, v = (p[o + 3] + ay * dt) * drag;
      const sp = Math.hypot(u, v);
      if (sp > m * 3){ u *= m * 3 / sp; v *= m * 3 / sp; }
      let nx = x + u * dt, ny = y + v * dt;
      if (nx < 0 || nx > w){ u = -u * .6; nx = Math.min(w, Math.max(0, nx)); }
      if (ny < 0 || ny > h){ v = -v * .6; ny = Math.min(h, Math.max(0, ny)); }
      p[o] = nx; p[o + 1] = ny; p[o + 2] = u; p[o + 3] = v;
      segs[Math.min(segs.length - 1, (sp / bs) | 0)].push(x === nx && y === ny ? nx + .6 : x, y, nx, ny);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineWidth = 1.4;
    segs.forEach((sg, b) => {
      if (!sg.length) return;
      ctx.strokeStyle = this.palette[b]; ctx.globalAlpha = .6;
      ctx.beginPath();
      for (let j = 0; j < sg.length; j += 4){ ctx.moveTo(sg[j], sg[j + 1]); ctx.lineTo(sg[j + 2], sg[j + 3]); }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    for (const [cx, cy] of wells){
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, m * .09);
      g.addColorStop(0, 'rgba(255,197,107,.35)'); g.addColorStop(1, 'rgba(255,197,107,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, m * .09, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#04050b';
    for (const [cx, cy] of wells){ ctx.beginPath(); ctx.arc(cx, cy, m * .018, 0, 7); ctx.fill(); }
  }
};

// The mint clay TV in the moonlit bedroom, running a little falling-sand world: spouts pour sand, water
// and lava; lava meeting water turns to stone and steam, plants creep into the water, then it clears.
ARTS.grain = {
  // empty, sand, water, lava, stone, steam, plant
  colors: [null, ['#f2d38a', '#e8c477'], ['#6fb7ff', '#86c5ff'], ['#ff7a3a', '#ffb347'], ['#8d8aa8', '#7c7998'], ['#dfe3ff', '#c9cdf0'], ['#8fdc7a', '#74c766']],
  init(s, w, h){
    s.gw = 48; s.gh = 36; s.g = new Uint8Array(s.gw * s.gh); s.tone = new Uint8Array(s.gw * s.gh); s.moved = new Uint8Array(s.gw * s.gh);
    s.acc = 0; s.clock = 0; s.spouts = [{ x: 10, v: .22, m: 1 }, { x: 36, v: -.18, m: 3 }];
    this.seed(s);
  },
  seed(s){
    const { gw, gh, g } = s;
    g.fill(0);
    for (let x = 0; x < gw; x++) if (Math.abs(x - 24) < 7 || x < 4) g[(gh - 1) * gw + x] = 4;
    for (const x of [6, 30, 41]) for (let y = gh - 4; y < gh - 1; y++) g[y * gw + x] = 6;
    s.clock = 0;
  },
  step(s){
    const { gw, gh, g, tone, moved } = s;
    moved.fill(0);
    const put = (i, j) => { g[j] = g[i]; tone[j] = tone[i]; g[i] = 0; moved[j] = 1; };
    const swap = (i, j) => { const a = g[i], b = tone[i]; g[i] = g[j]; tone[i] = tone[j]; g[j] = a; tone[j] = b; moved[i] = moved[j] = 1; };
    const free = (x, y) => x >= 0 && x < gw && y >= 0 && y < gh && !g[y * gw + x];
    for (let y = gh - 1; y >= 0; y--){
      const ltr = Math.random() < .5;
      for (let k = 0; k < gw; k++){
        const x = ltr ? k : gw - 1 - k, i = y * gw + x, c = g[i];
        if (!c || moved[i]) continue;
        const d = Math.random() < .5 ? 1 : -1;
        if (c === 1 || c === 4){ // sand, and stone, which only drops
          if (free(x, y + 1)) put(i, i + gw);
          else if (y + 1 < gh && g[i + gw] === 2) swap(i, i + gw);
          else if (c === 1 && free(x + d, y + 1)) put(i, i + gw + d);
        } else if (c === 2 || c === 3){ // water, and slower lava
          if (c === 3){
            for (const j of [i - 1, i + 1, i - gw, i + gw]) if (j >= 0 && j < g.length && g[j] === 2){ g[i] = 4; g[j] = 5; moved[j] = 1; break; }
            if (g[i] !== 3 || Math.random() < .5) continue;
          }
          if (free(x, y + 1)) put(i, i + gw);
          else if (c === 3 && y + 1 < gh && g[i + gw] === 2) swap(i, i + gw);
          else if (free(x + d, y + 1)) put(i, i + gw + d);
          else if (free(x + d, y) && Math.random() < (c === 2 ? .9 : .3)) put(i, i + d);
        } else if (c === 5){ // steam rises and fades
          if (Math.random() < .03){ g[i] = 0; continue; }
          if (free(x, y - 1)) put(i, i - gw);
          else if (y > 0 && g[i - gw] === 2) swap(i, i - gw);
          else if (free(x + d, y - 1)) put(i, i - gw + d);
          else if (free(x + d, y)) put(i, i + d);
          else if (y === 0) g[i] = 0;
        } else if (c === 6 && Math.random() < .04){ // plants grow into water
          const j = [i - 1, i + 1, i - gw, i + gw][Math.random() * 4 | 0];
          if (j >= 0 && j < g.length && g[j] === 2){ g[j] = 6; tone[j] = Math.random() * 2 | 0; moved[j] = 1; }
        }
      }
    }
    // the spouts wander and change material now and then
    for (const sp of s.spouts){
      sp.x += sp.v; if (sp.x < 3 || sp.x > gw - 4) sp.v = -sp.v;
      if (Math.random() < .006) sp.m = [1, 2, 3][Math.random() * 3 | 0];
      for (const x of [Math.round(sp.x), Math.round(sp.x) + 1]) if (!g[x] && Math.random() < [0, .7, .3, .6][sp.m]){ g[x] = sp.m; tone[x] = Math.random() * 2 | 0; }
    }
    let n = 0; for (let i = 0; i < g.length; i++) if (g[i] && g[i] !== 5) n++;
    if (++s.clock > 1100 || n > g.length * .6) this.seed(s);
  },
  frame(ctx, s, w, h, t, dt){
    s.acc += dt;
    while (s.acc > 1 / 40){ s.acc -= 1 / 40; this.step(s); }
    const { gw, gh, g, tone } = s;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#2e2d57'; ctx.fillRect(0, 0, w, h);
    // moonlight through the blinds, and the lamp's warm pool
    ctx.save(); ctx.translate(w * .12, -h * .1); ctx.rotate(.35);
    ctx.fillStyle = 'rgba(190,200,255,.07)';
    for (let i = 0; i < 6; i++) ctx.fillRect(0, i * h * .09, w * .32, h * .045);
    ctx.restore();
    const lamp = ctx.createRadialGradient(w * .9, h * .2, 0, w * .9, h * .2, w * .45);
    lamp.addColorStop(0, 'rgba(255,200,150,.28)'); lamp.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = lamp; ctx.fillRect(0, 0, w, h);
    // dust in the beam
    ctx.fillStyle = 'rgba(255,240,220,.35)';
    for (let i = 0; i < 14; i++){ const x = (w * (.05 + .07 * i) + Math.sin(t * .3 + i) * 12) % w, y = h * (.15 + .5 * ((i * .37 + t * .02) % 1)); ctx.fillRect(x, y, 1.5, 1.5); }
    // the TV: mint body, dark screen sized 4:3 inside it
    const sh = Math.min(h * .64, w * .52 * 3 / 4), sw = sh * 4 / 3, bx = (w - sw) / 2, by = (h - sh) / 2 - h * .04, b = sh * .1;
    ctx.fillStyle = 'rgba(20,18,50,.35)'; ctx.beginPath(); ctx.ellipse(w / 2, by + sh + b * 2.3, sw * .62, b * .7, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#a6e3cc';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - b, by - b, sw + b * 2, sh + b * 3, b * 1.6) : ctx.rect(bx - b, by - b, sw + b * 2, sh + b * 3); ctx.fill();
    ctx.fillStyle = '#f8d3e6'; ctx.beginPath(); ctx.arc(bx + sw - b * .2, by + sh + b * 1.15, b * .38, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#f8d3e6'; ctx.beginPath(); ctx.arc(bx + sw - b * 1.3, by + sh + b * 1.15, b * .26, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#1f1a2c'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, sw, sh, b * .8) : ctx.rect(bx, by, sw, sh); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, sw, sh, b * .8) : ctx.rect(bx, by, sw, sh); ctx.clip();
    const cw = sw / gw, chh = sh / gh;
    for (let i = 0; i < g.length; i++){
      const c = g[i]; if (!c) continue;
      let col = this.colors[c][tone[i]];
      if (c === 3 && Math.random() < .2) col = '#ffd36a';
      ctx.globalAlpha = c === 5 ? .8 : 1;
      ctx.fillStyle = col; ctx.fillRect(bx + (i % gw) * cw, by + Math.floor(i / gw) * chh, cw + .5, chh + .5);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    for (let y = 0; y < sh; y += 3) ctx.fillRect(bx, by + y, sw, 1);
    const sheen = ctx.createLinearGradient(bx, by, bx + sw, by + sh);
    sheen.addColorStop(0, 'rgba(255,255,255,.08)'); sheen.addColorStop(.4, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen; ctx.fillRect(bx, by, sw, sh);
    ctx.restore();
  }
};

// The clay solar system floating in a starfield: glowing orbit hoops, the asteroid and Kuiper belts as
// pebbles, Saturn's rings, the Moon around Earth, Pluto on its tilted, stretched loop, and the odd meteor.
ARTS.orrery = {
  init(s, w, h){
    s.t0 = Math.random() * 100;
    // color, orbit radius (share of the model), year in Earth years, size, ring
    s.p = [['#c9bfd6', .17, .24, 3.2], ['#f2b26e', .23, .62, 4.4], ['#6fb6e8', .3, 1, 4.6], ['#f07d55', .37, 1.88, 3.8],
      ['#e8a06e', .52, 11.86, 10.5], ['#e9cf8c', .64, 29.46, 8.5, 'saturn'], ['#7fd6cf', .76, 84, 6.4, 'uranus'], ['#4a6ee0', .87, 164.8, 6.4]];
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    s.stars = []; for (let i = 0; i < 90; i++) s.stars.push([rnd() * w, rnd() * h, rnd() * 1.3 + .3, rnd() * 6.3]);
    s.belt = []; for (let i = 0; i < 110; i++) s.belt.push([.43 + rnd() * .05, rnd() * 6.3, rnd() * 1.1 + .5]);
    s.kuiper = []; for (let i = 0; i < 90; i++) s.kuiper.push([.93 + rnd() * .1, rnd() * 6.3, rnd() * 1.2 + .5]);
    s.meteor = null;
  },
  frame(ctx, s, w, h, t, dt){
    const cx = w / 2, cy = h * .54, R = Math.min(w * .47, h * .78), sq = .36, yr = (s.t0 + t) / 7;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1f1d42'; ctx.fillRect(0, 0, w, h);
    // nebula haze and a dome of stars
    const neb = ctx.createRadialGradient(w * .42, h * .05, 0, w * .42, h * .05, h * .9);
    neb.addColorStop(0, 'rgba(140,120,200,.55)'); neb.addColorStop(1, 'rgba(140,120,200,0)');
    ctx.fillStyle = neb; ctx.fillRect(0, 0, w, h);
    for (const [x, y, r, p] of s.stars){ ctx.fillStyle = 'rgba(235,230,255,' + (.35 + .3 * Math.sin(t * 1.3 + p)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
    // a meteor now and then
    if (!s.meteor && Math.random() < dt * .25) s.meteor = { x: Math.random() * w, y: Math.random() * h * .3, age: 0 };
    if (s.meteor){
      const m = s.meteor; m.age += dt;
      const x = m.x - m.age * w * .5, y = m.y + m.age * h * .35, g = ctx.createLinearGradient(x, y, x + 40, y - 28);
      g.addColorStop(0, 'rgba(255,240,230,.85)'); g.addColorStop(1, 'rgba(255,240,230,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 40, y - 28); ctx.stroke();
      if (m.age > .9) s.meteor = null;
    }
    // orbit hoops, glowing
    ctx.globalCompositeOperation = 'lighter';
    const hoop = (rx, ry, ox, oy, rot) => { ctx.beginPath(); ctx.ellipse(cx + ox, cy + oy, rx, ry, rot, 0, 6.2832); };
    for (const p of s.p){
      hoop(R * p[1], R * p[1] * sq, 0, 0, 0);
      ctx.strokeStyle = 'rgba(200,160,255,.10)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = 'rgba(214,180,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
    }
    hoop(R * .98, R * .98 * sq * .82, R * .2, -R * .03, -.12);
    ctx.strokeStyle = 'rgba(214,180,255,.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    const pebbles = (list, spin) => { ctx.fillStyle = 'rgba(200,195,225,.55)'; for (const [r, a, sz] of list){ const u = a + yr * spin; ctx.beginPath(); ctx.arc(cx + Math.cos(u) * R * r, cy + Math.sin(u) * R * r * sq, sz, 0, 6.2832); ctx.fill(); } };
    pebbles(s.belt, 1.4); pebbles(s.kuiper, .05);
    // the sun's glow
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * .3);
    glow.addColorStop(0, 'rgba(255,214,170,.6)'); glow.addColorStop(1, 'rgba(255,214,170,0)');
    ctx.fillStyle = glow; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    const ball = (x, y, r, c) => { const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.3, c); g.addColorStop(1, c); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); };
    const items = s.p.map((p, i) => { const a = yr / p[2] * 6.2832 + i * 1.7; return { p, i, a, x: cx + Math.cos(a) * R * p[1], y: cy + Math.sin(a) * R * p[1] * sq, back: Math.sin(a) < 0 }; });
    // Pluto on its tilted loop
    const pa = yr / 248 * 6.2832 + 2;
    items.push({ p: ['#d9a27f', 0, 0, 2.2], x: cx + R * .2 + Math.cos(pa) * R * .98 * Math.cos(-.12) - Math.sin(pa) * R * .98 * sq * .82 * Math.sin(-.12), y: cy - R * .03 + Math.cos(pa) * R * .98 * Math.sin(-.12) + Math.sin(pa) * R * .98 * sq * .82 * Math.cos(-.12), back: Math.sin(pa) < 0 });
    const draw = (it) => {
      const [c, , , r, ring] = it.p, x = it.x, y = it.y - r * .6;
      if (ring){
        ctx.strokeStyle = ring === 'saturn' ? 'rgba(238,222,180,.85)' : 'rgba(200,240,235,.6)'; ctx.lineWidth = ring === 'saturn' ? 2.2 : 1;
        ctx.beginPath(); ring === 'saturn' ? ctx.ellipse(x, y, r * 2.1, r * .55, -.35, 0, 6.2832) : ctx.ellipse(x, y, r * .5, r * 1.6, .2, 0, 6.2832); ctx.stroke();
      }
      ball(x, y, r, c);
      if (it.i === 2){ const m = t * 1.6; ball(x + Math.cos(m) * r * 2.4, y + Math.sin(m) * r * .9, 1.3, '#e8e4ef'); }
    };
    for (const it of items) if (it.back) draw(it);
    ball(cx, cy - R * .06, R * .11, '#ffdcae');
    for (const it of items) if (!it.back) draw(it);
  }
};

// The phosphor screen cycling through the app's modes: a turning Lissajous knot, then the Draw tab's
// Write spelling words in its vector font, then a spinning wireframe cube, with afterglow between them.
ARTS.scope = {
  // strokes on a 4 x 6 grid, y down
  font: {
    S: [[[4, 0], [0, 0], [0, 3], [4, 3], [4, 6], [0, 6]]],
    T: [[[0, 0], [4, 0]], [[2, 0], [2, 6]]],
    I: [[[1, 0], [3, 0]], [[2, 0], [2, 6]], [[1, 6], [3, 6]]],
    M: [[[0, 6], [0, 0], [2, 3], [4, 0], [4, 6]]],
    L: [[[0, 0], [0, 6], [4, 6]]],
    A: [[[0, 6], [2, 0], [4, 6]], [[1, 3], [3, 3]]],
    B: [[[0, 6], [0, 0], [3, 0], [4, 1], [4, 2], [3, 3], [0, 3]], [[3, 3], [4, 4], [4, 5], [3, 6], [0, 6]]]
  },
  init(s){ s.ph = 0; s.fresh = true; },
  frame(ctx, s, w, h, t, dt){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = s.fresh ? '#060b08' : 'rgba(6,11,8,.3)'; ctx.fillRect(0, 0, w, h); s.fresh = false;
    const R = Math.min(w, h) * .4, cx = w / 2, cy = h / 2;
    ctx.strokeStyle = 'rgba(150,190,160,.12)'; ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++){
      ctx.beginPath(); ctx.moveTo(cx + i * R / 4, cy - R); ctx.lineTo(cx + i * R / 4, cy + R); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - R, cy + i * R / 4); ctx.lineTo(cx + R, cy + i * R / 4); ctx.stroke();
    }
    s.ph += dt * .25;
    const mode = Math.floor(t / 6) % 3;
    // the beam's strokes; between strokes it darts across, faintly
    const strokes = [], path = [];
    strokes.push(path);
    if (mode === 0){
      for (let i = 0; i <= 400; i++){ const u = i / 400 * 6.2832; path.push([cx + R * Math.sin(2 * u), cy - R * Math.sin(3 * u + s.ph)]); }
    } else if (mode === 1){
      const sz = R * .1;
      ['STIM', 'LAB'].forEach((word, row) => {
        const x0 = cx - (word.length * 6 - 2) * sz / 2, y0 = cy - R * .71 + row * sz * 8.2;
        [...word].forEach((ch, k) => { for (const st of this.font[ch]) strokes.push(st.map(([x, y]) => [x0 + (k * 6 + x) * sz, y0 + y * sz])); });
      });
    } else {
      const a = t * .9, b = t * .6, V = [];
      for (let i = 0; i < 8; i++){
        let x = i & 1 ? 1 : -1, y = i & 2 ? 1 : -1, z = i & 4 ? 1 : -1;
        [x, z] = [x * Math.cos(a) - z * Math.sin(a), x * Math.sin(a) + z * Math.cos(a)];
        [y, z] = [y * Math.cos(b) - z * Math.sin(b), y * Math.sin(b) + z * Math.cos(b)];
        const f = 2.6 / (z + 4);
        V.push([cx + x * R * .62 * f, cy + y * R * .62 * f]);
      }
      for (const i of [0, 1, 3, 2, 0, 4, 5, 7, 6, 4, 5, 1, 3, 7, 6, 2]) path.push(V[i]);
    }
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const all = strokes.filter((st) => st.length);
    ctx.beginPath(); all.forEach((st, i) => i ? ctx.lineTo(st[0][0], st[0][1]) : ctx.moveTo(st[0][0], st[0][1]));
    ctx.strokeStyle = 'rgba(141,255,114,.06)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    for (const st of all) st.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = 'rgba(141,255,114,.18)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = 'rgba(141,255,114,.8)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
};

// A laser projector on a hazy stage, fanning beams that sweep and change color on the beat, while the
// back wall cycles through looks every eight beats: a wobbling ring, a scrolling waveform, a spinning star.
ARTS.beam = {
  init(){},
  frame(ctx, s, w, h, t){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, w, h);
    const px = w / 2, py = h * .92, beat = t * 2, ph = beat % 1, cols = ['#39ff7a', '#00e5ff', '#ff3fb4', '#ffe600'];
    const col = cols[Math.floor(beat / 8) % cols.length], n = 9, fl = .35 + .65 * Math.exp(-ph * 3);
    // haze
    const haze = ctx.createRadialGradient(px, py, 0, px, py, h);
    haze.addColorStop(0, rgba(col, .1)); haze.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = haze; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < n; i++){
      const a = -Math.PI / 2 + (i / (n - 1) - .5) * (1.5 + .5 * Math.sin(t * .9)) + .25 * Math.sin(t * 1.3 + i * .4);
      const ex = px + Math.cos(a) * h * 1.4, ey = py + Math.sin(a) * h * 1.4;
      for (const [lw, al] of [[6, .05], [1.4, .55]]){
        ctx.strokeStyle = rgba(col, al * fl); ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
      }
    }
    // the look on the back wall, with its own color, drawing itself on at the start of each turn
    const look = Math.floor(beat / 8) % 3, u = (beat % 8) / 8, on = Math.min(1, u * 4), R = h * .2, cy = h * .3;
    const lc = cols[(Math.floor(beat / 8) + 2) % cols.length], pts = [];
    if (look === 0){
      for (let i = 0; i <= 80; i++){ const a = i / 80 * Math.PI * 2, r = R * (1 + .08 * Math.sin(6 * a + t * 4)); pts.push([px + Math.cos(a + t) * r * 1.4, cy + Math.sin(a + t) * r * .45]); }
    } else if (look === 1){
      for (let i = 0; i <= 80; i++){ const x = i / 80, amp = R * .45 * (.5 + .5 * Math.exp(-ph * 4)); pts.push([px + (x - .5) * w * .7, cy + Math.sin(x * 14 - t * 6) * amp]); }
    } else {
      for (let i = 0; i <= 10; i++){ const a = i / 10 * Math.PI * 2 + t * 1.2, r = R * (i % 2 ? .45 : 1.05) * (1 + .1 * Math.exp(-ph * 4)); pts.push([px + Math.cos(a) * r, cy + Math.sin(a) * r * .9]); }
    }
    ctx.beginPath();
    pts.slice(0, Math.max(2, Math.ceil(pts.length * on))).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = rgba(lc, .2); ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = rgba(lc, .85); ctx.lineWidth = 1.3; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1b1d2b'; ctx.fillRect(px - 16, py, 32, h);
  }
};

// A wobbly hummed line being drawn across a note grid, with notes snapping into place behind the pen.
ARTS.worm = {
  tune: [0, 2, 4, 5, 7, 7, 9, 7, 4, 5, 4, 2, 0, 2, -1, 0],
  init(s){ s.t0 = 0; },
  frame(ctx, s, w, h, t){
    const dur = 7, u = ((t - s.t0) % (dur + 1.2)) / dur, n = this.tune.length;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#17151d'; ctx.fillRect(0, 0, w, h);
    const padX = w * .06, gw = w - padX * 2, rows = 14, rh = h * .78 / rows, top = h * .11;
    for (let r = 0; r < rows; r++){ ctx.fillStyle = [1, 3, 6, 8, 10].includes((13 - r) % 12) ? '#1a1721' : '#211e2a'; ctx.fillRect(padX, top + r * rh, gw, rh); }
    for (let i = 0; i <= n; i++){ ctx.fillStyle = i % 4 ? '#29252f' : '#3d3648'; ctx.fillRect(padX + i * gw / n, top, 1, rows * rh); }
    const yOf = (deg) => top + (11 - deg) * rh;
    const pen = Math.min(1, u) * n;
    // notes behind the pen
    for (let i = 0; i < n; i++){
      const a = clampA(pen - i - .6);
      if (a <= 0) continue;
      const x = padX + i * gw / n, y = yOf(this.tune[i]);
      ctx.globalAlpha = a * (u > 1 ? Math.max(0, 1 - (u - 1) * dur / 1.2) : 1);
      ctx.fillStyle = '#ff7a59';
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 1.5, y + 1.5, gw / n - 3, rh - 3, 3) : ctx.rect(x + 1.5, y + 1.5, gw / n - 3, rh - 3); ctx.fill();
    }
    ctx.globalAlpha = u > 1 ? Math.max(0, 1 - (u - 1) * dur / 1.2) : 1;
    // the hummed line: scoops into each note and wobbles with vibrato
    ctx.strokeStyle = 'rgba(255,240,228,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    const steps = Math.floor(pen * 12);
    for (let k = 0; k <= steps; k++){
      const f = k / 12, i = Math.min(n - 1, Math.floor(f)), fr = f - i;
      const prev = i ? this.tune[i - 1] : this.tune[0];
      const deg = this.tune[i] + (prev - this.tune[i]) * Math.exp(-fr * 9) + .18 * Math.sin(f * 7 + t * 2);
      const x = padX + f * gw / n, y = yOf(deg) + rh / 2;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    if (u <= 1){
      const x = padX + pen * gw / n;
      ctx.fillStyle = '#ff4d5e'; ctx.fillRect(x, top, 2, rows * rh);
    }
    ctx.globalAlpha = 1;
  }
};
function clampA(x){ return Math.max(0, Math.min(1, x * 2.5)); }

// A few glowing curves folded through a turning kaleidoscope, leaving trails, like the app's feedback loop.
ARTS.fold = {
  init(s){ s.frameN = 0; },
  frame(ctx, s, w, h, t){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = (++s.frameN % 6) ? 'rgba(0,0,0,.09)' : 'rgba(0,0,0,.2)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const sides = 6, r = Math.hypot(w, h) * .5;
    for (let k = 0; k < sides * 2; k++){
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate(Math.floor(k / 2) * Math.PI * 2 / sides + t * .08);
      if (k % 2) ctx.scale(1, -1);
      for (let c = 0; c < 3; c++){
        const hue = (300 + c * 50 + t * 12) % 360;
        ctx.beginPath();
        for (let i = 0; i <= 24; i++){
          const u = i / 24;
          const rr = r * u * (.35 + .65 * (.5 + .5 * Math.sin(t * .5 + c * 2.1)));
          const a = (Math.PI / sides) * (.5 + .5 * Math.sin(u * 6 + t * (.6 + c * .2) + c)) ;
          const x = rr * Math.cos(a), y = rr * Math.sin(a);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = 'hsla(' + hue + ',95%,62%,.10)'; ctx.lineWidth = 5; ctx.stroke();
        ctx.strokeStyle = 'hsla(' + hue + ',100%,75%,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
      }
      ctx.restore();
    }
  }
};

// The classic low-res "DOOM fire": heat rises from the bottom row, cooling and drifting as it climbs.
ARTS.doomfire = {
  init(s, w, h){
    s.cols = 64; s.rows = Math.max(24, Math.round(64 * h / w));
    s.heat = new Uint8Array(s.cols * s.rows);
    s.img = document.createElement('canvas');
    s.img.width = s.cols; s.img.height = s.rows;
    s.ictx = s.img.getContext('2d');
    s.data = s.ictx.createImageData(s.cols, s.rows);
    s.pal = [];
    for (let i = 0; i < 37; i++){
      const u = i / 36;
      s.pal.push([Math.min(255, 40 + u * 480) | 0, Math.max(0, Math.min(255, (u - .3) * 400)) | 0, Math.max(0, Math.min(255, (u - .78) * 1100)) | 0, i ? 255 : 0]);
    }
    s.acc = 0;
  },
  frame(ctx, s, w, h, t, dt){
    const { cols, rows, heat } = s;
    s.acc += dt;
    while (s.acc > 1 / 30){
      s.acc -= 1 / 30;
      const base = 36 * (.82 + .18 * Math.sin(t * .7));
      for (let x = 0; x < cols; x++) heat[(rows - 1) * cols + x] = base;
      for (let y = 1; y < rows; y++) for (let x = 0; x < cols; x++){
        const r = Math.random() * 3.2 | 0;
        const v = heat[y * cols + x] - (Math.random() < .5 ? 2 : 1);
        const nx = Math.min(cols - 1, Math.max(0, x - r + 1));
        heat[(y - 1) * cols + nx] = v > 0 ? v : 0;
      }
    }
    const d = s.data.data;
    for (let i = 0; i < heat.length; i++){
      const c = s.pal[heat[i]];
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = c[3];
    }
    s.ictx.putImageData(s.data, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = s.ground; ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(s.img, 0, 0, w, h);
  }
};

// Fallback for apps without their own preview: slow glows in the app's accent color.
ARTS.glow = {
  init(){},
  frame(ctx, s, w, h, t){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = s.ground; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++){
      const x = w * (.5 + .3 * Math.sin(t * (.15 + i * .05) + i * 2)), y = h * (.5 + .25 * Math.cos(t * (.12 + i * .04) + i));
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(w, h) * .45);
      g.addColorStop(0, rgba(s.accent, .28)); g.addColorStop(1, rgba(s.accent, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
  }
};

/* ---------- build the shelf ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const tiles = [];
const shelf = document.getElementById('shelf');

for (const app of APPS){
  const accent = app.accent || '#ffffff', ground = app.ground || '#0a0a0c';
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = app.href;
  a.style.setProperty('--ground', ground);
  a.style.setProperty('--accent', accent);
  a.style.setProperty('--edge', rgba(accent, .2));
  a.style.setProperty('--edge-hi', rgba(accent, .45));

  const art = document.createElement('div');
  art.className = 'art';
  const canvas = document.createElement('canvas');
  canvas.setAttribute('aria-hidden', 'true');
  art.appendChild(canvas);

  const label = document.createElement('div');
  label.className = 'label';
  const h2 = document.createElement('h2');
  h2.textContent = app.name;
  if (app.titleClass === 't-beam') h2.innerHTML = 'Beam<span>line</span>';
  if (app.titleClass) h2.className = app.titleClass;
  const p = document.createElement('p');
  p.textContent = app.blurb;
  label.append(h2, p);

  a.append(art, label);
  li.appendChild(a);
  shelf.appendChild(li);

  tiles.push({
    canvas, ctx: canvas.getContext('2d'),
    art: ARTS[app.art] || ARTS.glow,
    state: { accent, ground },
    w: 0, h: 0, visible: true, t: Math.random() * 20
  });
}

/* ---------- drawing loop: only visible tiles, only while the page is showing ---------- */
function sizeTile(tile){
  const r = tile.canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (!r.width || !r.height) return;
  tile.w = r.width; tile.h = r.height;
  tile.canvas.width = Math.round(r.width * dpr);
  tile.canvas.height = Math.round(r.height * dpr);
  tile.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tile.art.init(tile.state, tile.w, tile.h);
  if (reduceMotion.matches) drawStill(tile);
}
// With reduced motion, settle each preview into a single still frame.
function drawStill(tile){
  const steps = tile.art === ARTS.ink || tile.art === ARTS.wells || tile.art === ARTS.grain || tile.art === ARTS.fold || tile.art === ARTS.doomfire ? 160 : 1;
  for (let i = 0; i < steps; i++) tile.art.frame(tile.ctx, tile.state, tile.w, tile.h, tile.t + i / 60, 1 / 60);
}

if ('ResizeObserver' in window){
  const ro = new ResizeObserver((entries) => {
    for (const e of entries){ const tile = tiles.find((x) => x.canvas === e.target); if (tile) sizeTile(tile); }
  });
  tiles.forEach((tile) => ro.observe(tile.canvas));
} else {
  tiles.forEach(sizeTile);
  window.addEventListener('resize', () => tiles.forEach(sizeTile));
}
if ('IntersectionObserver' in window){
  const io = new IntersectionObserver((entries) => {
    for (const e of entries){ const tile = tiles.find((x) => x.canvas === e.target); if (tile) tile.visible = e.isIntersecting; }
  });
  tiles.forEach((tile) => io.observe(tile.canvas));
}

let last = 0, rafId = 0;
function loop(now){
  const dt = Math.min(.05, last ? (now - last) / 1000 : 1 / 60);
  last = now;
  for (const tile of tiles){
    if (!tile.visible || !tile.w) continue;
    tile.t += dt;
    tile.art.frame(tile.ctx, tile.state, tile.w, tile.h, tile.t, dt);
  }
  rafId = requestAnimationFrame(loop);
}
function start(){ if (!rafId && !reduceMotion.matches && !document.hidden){ last = 0; rafId = requestAnimationFrame(loop); } }
function stop(){ cancelAnimationFrame(rafId); rafId = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
reduceMotion.addEventListener && reduceMotion.addEventListener('change', () => { stop(); tiles.forEach(sizeTile); start(); });
// Coming back with the Back gesture can restore this page from memory; restart the previews when it does.
window.addEventListener('pageshow', () => { stop(); start(); });
start();
</script>
