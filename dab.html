<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dab">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen canvas (the picture on a dark stage), two small pills in the top corners,
   a tool rail (left edge on iPad, a row above the paints on a phone), the numbered paints along the
   bottom, and sheets for Pictures and Look. Single dark theme: the paint is the light. */
:root{
  color-scheme:dark;
  --void:#07080d;
  --glass:rgba(18,19,28,.78);
  --line:rgba(225,230,255,.12);
  --text:#f1f2f8;
  --muted:#9a9db3;
  --accent:#ff9db0;
  --accent-ink:#2a0a12;
  --font-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --font-body:'Figtree',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--text);
  font:500 15px/1.35 var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:none}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.pill{position:fixed;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
.pill button,.pill a{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--text);text-decoration:none}
.pill button:hover,.pill a:hover{background:rgba(255,255,255,.07)}
.pill button:disabled{opacity:.3}
.pill button[aria-pressed="true"],.pill button[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.pill .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.home svg{fill:currentColor;stroke:none}
#tl{top:calc(10px + var(--st));left:calc(10px + var(--sl))}
#tr{top:calc(10px + var(--st));right:calc(10px + var(--sr))}
#pct{min-width:54px;padding:0 12px 0 6px;font:700 15px var(--font-body);font-variant-numeric:tabular-nums;color:var(--text);text-align:center}

/* tools */
#rail{left:calc(10px + var(--sl));top:50%;transform:translateY(-50%);flex-direction:column;border-radius:28px}
#rail .sep{width:22px;height:1px;margin:4px 0}
#rail button{position:relative}
#rail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#sizeBtn i{display:block;border-radius:50%;background:currentColor;width:14px;height:14px}
#btnDoodle[hidden]{display:none}
#sizePop{position:fixed;z-index:6;left:calc(72px + var(--sl));top:50%;transform:translateY(-50%);padding:14px 16px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:230px}
#sizePop[hidden]{display:none}
#sizePop label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
#sizePop label b{color:var(--text);font-weight:600}

/* paints */
#paints{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));
  max-width:min(940px,calc(100vw - 20px - var(--sl) - var(--sr)));padding:8px 10px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
#paints::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:46px;height:46px;border-radius:50%;padding:3px;position:relative;
  background:conic-gradient(var(--ring,#fff) calc(var(--p,0)*1%),rgba(255,255,255,.13) 0);transition:transform .12s}
.sw span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c);color:var(--ink);
  font:700 16px var(--font-body);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px var(--void)}
.sw[aria-pressed="true"]{transform:scale(1.16);z-index:1}
.sw[aria-pressed="true"] span{box-shadow:inset 0 0 0 2px var(--void),0 0 16px 1px var(--c)}
.sw.done{opacity:.45}
.sw.done span{font-size:0}
.sw.done span::after{content:"";width:13px;height:7px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-2px)}
.sw.nudge{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(1.1)}}

/* sheets */
.sheet{position:fixed;z-index:8;background:rgba(14,15,23,.94);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.sheet h2{font:italic 600 26px/1 var(--font-display);margin:0;letter-spacing:.01em}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2;
  background:rgba(14,15,23,.96);padding:16px 18px 12px}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07)}
#look{top:calc(64px + var(--st));right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));width:340px;border-radius:22px}
#look .body{padding:0 18px 18px}
#look h3{font:700 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:7px 0}
.row label{color:var(--text)}
.row output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row input[type=range]{grid-column:1/-1}
.row select{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-9px;border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:0}
select{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.tog{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
.btn{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4}
.hintline{color:var(--muted);font-size:13px;margin:6px 0 0}

#gallery{inset:calc(14px + var(--st)) calc(14px + var(--sr)) calc(14px + var(--sb)) calc(14px + var(--sl));border-radius:26px;max-width:1000px;margin:0 auto}
#gallery .body{padding:4px 18px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;border-radius:18px;overflow:hidden;background:#0b0c13;border:1px solid var(--line);text-align:left;display:block;width:100%}
.card.cur{border-color:var(--accent)}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#11131c}
.card .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.card .cap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.card .bar{height:3px;background:rgba(255,255,255,.1)}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card .mini{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.card .mini button{padding:6px 10px;border-radius:999px;background:rgba(7,8,13,.78);border:1px solid var(--line);font-size:12px;font-weight:600}
.photo{margin-top:18px;padding:16px;border-radius:18px;border:1px dashed rgba(225,230,255,.22);display:grid;gap:10px}
.photo h3{margin:0;font:600 17px var(--font-body)}
.photo .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:end}
.photo .opts label{color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}

#toast{position:fixed;z-index:9;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);padding:10px 16px;border-radius:999px;
  background:rgba(18,19,28,.92);border:1px solid var(--line);font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100vw - 30px);text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(7,8,13,.82);font:italic 600 26px var(--font-display)}
#busy[hidden]{display:none}
#done{position:fixed;z-index:7;left:50%;top:calc(74px + var(--st));transform:translateX(-50%);padding:14px 18px;border-radius:22px;text-align:center;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:10px}
#done[hidden]{display:none}
#done b{font:italic 600 24px var(--font-display)}
#done div{display:flex;gap:8px;justify-content:center}
#peek{position:fixed;z-index:6;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:42px;height:42px;border-radius:50%;display:none;place-items:center;color:rgba(255,255,255,.35)}

body.bare .pill,body.bare #paints,body.bare #sizePop,body.bare #done{display:none}
body.bare #peek{display:grid}
/* while the Pencil is on the glass, a resting palm must not press buttons */
body.inking .pill,body.inking #paints,body.inking .sheet,body.inking #done{pointer-events:none}
.nofs #btnFs{display:none}

@media (max-width:700px){
  #rail{flex-direction:row;top:auto;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));border-radius:999px;max-width:calc(100vw - 16px)}
  #rail .sep{width:1px;height:22px;margin:0 3px}
  #rail button{width:38px;height:38px}
  #sizePop{left:50%;top:auto;transform:translateX(-50%);bottom:calc(142px + var(--sb))}
  .pill button,.pill a{width:38px;height:38px}
  #btnFit,#btnFs{display:none}
  #look{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + var(--sb));max-height:62vh}
  #pct{min-width:44px;padding:0 8px 0 2px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .photo .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.sw,.tog,.tog::after{transition:none}.sw.nudge{animation:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Paint by numbers picture"></canvas>

<nav class="pill" id="tl" aria-label="Dab">
  <a class="home" href="./" aria-label="Back to Stim Lab" title="Stim Lab">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
  </a>
  <span class="sep" aria-hidden="true"></span>
  <button id="btnPics" aria-expanded="false" aria-label="Pictures" title="Pictures">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17"/></svg>
  </button>
  <button id="pct" aria-label="Progress" title="Progress">0%</button>
</nav>

<nav class="pill" id="tr" aria-label="View">
  <button id="btnUndo" aria-label="Undo" title="Undo (Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0 -5)"/></svg></button>
  <button id="btnRedo" aria-label="Redo" title="Redo (Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12" transform="translate(0 -5)"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btnFit" aria-label="Fit picture to screen" title="Fit (R)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="btnLook" aria-expanded="false" aria-label="Look and feel" title="Look (C)"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button id="btnFs" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></svg></button>
  <button id="btnHide" aria-label="Hide controls" title="Hide controls (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
</nav>
<button id="peek" aria-label="Show controls" title="Show controls (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>

<nav class="pill" id="rail" aria-label="Brushes">
  <button data-tool="pen" aria-label="Fine pen" title="Fine pen (1)"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
  <button data-tool="brush" aria-label="Soft brush" title="Soft brush (2)"><svg viewBox="0 0 24 24"><path d="M19.5 3.5c1 1 .6 2.4-.4 3.6L12 15l-3-3 7.9-7.1c1.2-1 2.6-1.4 3.600-.4z"/><path d="M9 12c-3 0-4.500 2-4.500 4.500 0 1.500-1 2.500-2 3 3.500 1 8 .5 9.500-4.500"/></svg></button>
  <button data-tool="marker" aria-label="Chisel marker" title="Chisel marker (3)"><svg viewBox="0 0 24 24"><path d="M14 3l7 7-9 9H7l-2-2v-5z"/><path d="M5 12l7 7M3 21h6"/></svg></button>
  <button data-tool="crayon" aria-label="Crayon" title="Crayon (4)"><svg viewBox="0 0 24 24"><path d="M6 21l-3-3L15 6l3 3z"/><path d="M15 6l2.500-2.500a1.400 1.400 0 012 0l1 1a1.400 1.400 0 010 2L18 9M8.500 12.500l3 3M11.500 9.500l3 3"/></svg></button>
  <button data-tool="doodle" id="btnDoodle" hidden aria-label="Secret stamp" title="Secret stamp (5)"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3.500"/><path d="M9.500 10.500c1 3 3 4.500 6 4.500"/><circle cx="16" cy="14" r="3.500"/><path d="M18.500 11.500L21 8M11 16l-1 5M15 17.500l1 3.500"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button data-tool="fill" aria-label="Fill a whole area" title="Fill (G)"><svg viewBox="0 0 24 24"><path d="M10.500 3.500l8 8-7 7a2 2 0 01-2.800 0L4 13.800a2 2 0 010-2.800z"/><path d="M4.500 11.500h13.500M20 15.500s1.500 2 1.500 3.200a1.500 1.500 0 01-3 0c0-1.200 1.500-3.200 1.500-3.200z"/></svg></button>
  <button data-tool="eraser" aria-label="Eraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M8.500 19.500L3.500 14.500a1.500 1.500 0 010-2.100l8.400-8.400a1.500 1.500 0 012.100 0l6 6a1.500 1.500 0 010 2.100l-7.400 7.400z"/><path d="M7.500 8.500l8 8M8.500 19.500H21"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button id="sizeBtn" aria-expanded="false" aria-label="Brush size" title="Brush size ([ and ])"><i></i></button>
</nav>
<div id="sizePop" hidden>
  <label for="size"><span id="sizeName">Size</span><b id="sizeVal"></b></label>
  <input type="range" id="size" min="2" max="160" step="1">
</div>

<div id="paints" role="toolbar" aria-label="Paints"></div>

<section class="sheet" id="look" hidden aria-label="Look and feel">
  <header><h2>Look</h2><button class="x" id="lookX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="lookBody"></div>
</section>

<section class="sheet" id="gallery" hidden aria-label="Pictures">
  <header><h2>Dab</h2><button class="x" id="galX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body">
    <div class="acts">
      <button class="btn" id="btnSave">Save image</button>
      <button class="btn" id="btnRestart">Start this one over</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="photo">
      <h3>Paint one of your photos</h3>
      <div class="opts">
        <div><label for="phCols">Colors <b id="phColsV">18</b></label><input type="range" id="phCols" min="6" max="36" value="18"></div>
        <div><label for="phDetail">Detail</label><select id="phDetail"><option value="0">Chunky</option><option value="1" selected>Medium</option><option value="2">Fine</option></select></div>
      </div>
      <div><button class="btn pri" id="btnPhoto">Choose a photo</button></div>
      <p class="hintline">The photo is turned into numbered areas on this device. It never leaves it.</p>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </div>
</section>

<div id="done" hidden><b>Finished!</b><div><button class="btn pri" id="doneSave">Save image</button><button class="btn" id="doneNext">Another picture</button></div></div>
<div id="toast" role="status"></div>
<div id="busy" hidden><span id="busyT">Mixing paints…</span></div>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<script>
/* ------------------------------------------------------------------
   Dab: paint by numbers, made for Apple Pencil.
   A picture is a map of numbered areas. Paint lands on its own layer; an area counts as finished once
   enough of it is covered with the right paint, and then it fills in.
   ------------------------------------------------------------------ */
'use strict';

/* ---------- settings: one row per setting. Add a row here and it shows up in Look and is saved. ---------- */
const PARAMS = [
  { key: 'guard',    group: 'Painting', label: 'Stay in the lines', type: 'toggle', def: true },
  { key: 'finishAt', group: 'Painting', label: 'An area is finished at', type: 'range', min: 60, max: 98, step: 1, def: 88, unit: '%' },
  { key: 'autoPick', group: 'Painting', label: 'Touching an area picks its paint', type: 'toggle', def: false },
  { key: 'vary',     group: 'Painting', label: 'Painterly shade changes', type: 'range', min: 0, max: 100, step: 1, def: 40, unit: '%' },
  { key: 'finger',   group: 'Pencil and fingers', label: 'One finger', type: 'select', def: 'auto',
    opts: [['auto', 'Paints until a Pencil shows up'], ['paint', 'Always paints'], ['move', 'Always moves the picture']] },
  { key: 'pSize',    group: 'Pencil and fingers', label: 'Pressure changes size', type: 'range', min: 0, max: 100, step: 1, def: 70, unit: '%' },
  { key: 'pFlow',    group: 'Pencil and fingers', label: 'Pressure changes strength', type: 'range', min: 0, max: 100, step: 1, def: 55, unit: '%' },
  { key: 'tilt',     group: 'Pencil and fingers', label: 'Tilt effect', type: 'range', min: 0, max: 100, step: 1, def: 70, unit: '%' },
  { key: 'smooth',   group: 'Pencil and fingers', label: 'Steady hand', type: 'range', min: 0, max: 90, step: 1, def: 30, unit: '%' },
  { key: 'cursor',   group: 'Pencil and fingers', label: 'Brush outline when hovering', type: 'toggle', def: true },

/* ---------- chimes: each paint number is a note ---------- */
let AC = null;
const SCALES = { penta: [0, 2, 4, 7, 9], major: [0, 2, 4, 5, 7, 9, 11], whole: [0, 2, 4, 6, 8, 10], minor: [0, 2, 3, 5, 7, 8, 10] };

}

}

/* ==================================================================
   Pencil, fingers, mouse and keys
   A Pencil always paints. Fingers paint until a Pencil has been seen; after that one finger moves the

    gesture = null; tapInfo = null; touches.clear();

cv.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018))); }, { passive: false });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === ' '){ spaceHeld = true; e.preventDefault(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === 'z') e.shiftKey ? redo() : undo();
  else if (k === '1') setTool('pen'); else if (k === '2') setTool('brush'); else if (k === '3') setTool('marker'); else if (k === '4') setTool('crayon'); else if (k === '5') setTool('doodle');
  else if (k === 'g') setTool('fill'); else if (k === 'e') setTool('eraser');
  else if (k === '[') setSize(toolSize(S.tool) * .85 - 1); else if (k === ']') setSize(toolSize(S.tool) * 1.18 + 1);
  else if (k === 'h') setBare(!document.body.classList.contains('bare'));
  else if (k === 'f') toggleFs(); else if (k === 'c') openSheet('look', $('look').hidden); else if (k === 'r') fit();
  else if (k === 'arrowright' || k === 'arrowdown'){ if (pic) selectPaint((pic.sel + 1) % pic.pal.length, true); e.preventDefault(); }
  else if (k === 'arrowleft' || k === 'arrowup'){ if (pic) selectPaint((pic.sel + pic.pal.length - 1) % pic.pal.length, true); e.preventDefault(); }
  else if (k === 'escape'){ openSheet('', false); closePops(); }
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') spaceHeld = false; });
window.addEventListener('resize', resize);

/* ---------- go ---------- */
if (!TOOLS[S.tool] || (S.tool === 'doodle' && !S.doodle)) S.tool = 'brush';
buildLook(); resize(); syncButtons();
requestAnimationFrame(frame);
openPicture(S.pic, true);
window.__dab = { get pic(){ return pic; }, P, S, view };
</script>
